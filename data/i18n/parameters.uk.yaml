parameters:
  applycal:
    -v:
      name: Докладний вивід
      tooltip_body: 'Виводить докладні відомості про калібрування, що застосовується,

        зокрема статистику кривих для кожного каналу.

        '
      tooltip_title: Докладний вивід (-v)
  colprof:
    -A:
      name: Виробник
      tooltip_body: 'Назва виробника, що записується в заголовок профілю ICC.

        Необов’язково — допомагає впізнати профіль у списках вибору

        профілів.

        '
      tooltip_title: Рядок виробника (-A)
    -C:
      name: Авторське право
      tooltip_body: 'Повідомлення про авторське право, що записується в профіль ICC.

        '
      tooltip_title: Рядок авторського права (-C)
    -D:
      name: Опис профілю
      tooltip_body: "Назва, що записується в профіль ICC, — її показують меню керування\nкольором у таких програмах, як Photoshop, Lightroom і «Перегляд».\n\nДотримуйтеся сталого формату, який називає принтер, папір, тип\nчорнила й дату, щоб потім легко знайти потрібний профіль:\n\n  Принтер · Папір · Тип чорнила · Дата\n  напр. \"Epson P900 · Canson Baryta · Chromatic · 2026-04\"\n\nВихідний файл називається за вашим файлом .ti3 — тримайте цю назву\nузгодженою з описом, з підкресленнями замість пробілів:\n  напр. EpsonP900_CansonBaryta_Chromatic_2026-04.icc\n"
      tooltip_title: Опис профілю (-D)
    -M:
      name: Модель
      tooltip_body: 'Назва моделі, що записується в заголовок профілю ICC.

        '
      tooltip_title: Рядок моделі (-M)
    -S:
      name: Джерело гамуту (перц. + насич.)
      tooltip_body: 'Як -s, але відображення гамуту застосовується і до перцептивного

        наміру відтворення, і до наміру насиченості.

        '
      tooltip_title: Джерело для перцептивного й насиченого наміру (-S)
    -V:
      name: Акцент сітки на темних ділянках
      tooltip_body: "Додає додаткові вузли сітки cLUT у темних ділянках (тінях).\n1.0 = рівномірна сітка (типово). Збільште до 1.5–2.0 для принтерів\n  зі складною поведінкою в тінях або «забитим» чорним.\n"
      tooltip_title: Акцент сітки на темних ділянках (-V)
    -a:
      labels:
      - 'l: Lab cLUT (рекомендовано для принтерів RGB)'
      - 'x: XYZ cLUT'
      name: Алгоритм профілю
      tooltip_body: "Вибирає алгоритм перетворення кольору:\n• Lab cLUT (-al): найкраща точність для профілів принтера.\n  Використовує повну тривимірну таблицю пошуку в просторі L*a*b*.\n  Рекомендовано.\n• XYZ cLUT (-ax): подібно до Lab, але в просторі XYZ. Іноді дає\n  плавніші нейтральні переходи.\nТретього варіанта немає: профіль принтера ArgyllCMS будує лише як\nтаблицю пошуку, а моделі «гама», «формувальні криві» й «матриця»\nдля нього не приймає. Вони підходять для сканера, камери чи\nдисплея, і ChromIQ пропонує їх у вікні сканера.\nДля перших профілів принтера RGB завжди використовуйте Lab cLUT\n(-al).\n"
      tooltip_title: Алгоритм профілю (-a)
    -b:
      labels:
      - Як якість профілю (типово)
      - 'l: Низька'
      - 'm: Середня'
      - 'h: Висока'
      - 'u: Ультра'
      - 'n: Немає (без таблиць B2A)'
      name: Якість таблиці B2A
      tooltip_body: 'Окремо задає якість таблиць B2A (пристрій→PCS), які

        використовуються для вхідних перетворень (наприклад, для екранної

        проби).

        Залиште порожнім, щоб узяти основну якість із -q.

        «n» не записує таблиць B2A і зменшує розмір файлу профілю

        (профілям лише для виводу B2A не потрібні).

        '
      tooltip_title: Якість таблиці B2A (-b)
    -ni:
      name: Без вхідних формувальних кривих
      tooltip_body: 'Вимикає одновимірні вхідні формувальні (тонові) криві, які

        попередньо обробляють значення пристрою перед тривимірною cLUT.

        Зазвичай ці криві підвищують точність профілю. Вимикайте лише для

        діагностики.

        '
      tooltip_title: Без вхідних формувальних кривих (-ni)
    -no:
      name: Без вихідних формувальних кривих
      tooltip_body: 'Вимикає одновимірні вихідні формувальні криві, що застосовуються

        після тривимірної cLUT.

        Вимикайте лише для діагностики.

        '
      tooltip_title: Без вихідних формувальних кривих (-no)
    -q:
      labels:
      - 'l: Низька (швидко, ~30 с)'
      - 'm: Середня (рекомендовано, ~2 хв)'
      - 'h: Висока (~10 хв)'
      - 'u: Ультра (~30+ хв)'
      name: Якість профілю
      tooltip_body: "Задає роздільність сітки cLUT і кількість ітерацій згладжування:\n• Низька: сітка 17³ — швидка перевірка, не для роботи\n• Середня: сітка 33³ — добрий баланс, рекомендоване типове\n  значення\n• Висока: сітка 45³ — робоча якість\n• Ультра: сітка 65³ — максимальна точність, дуже повільно\nДля більшості струменевого друку досить середньої якості.\nВисоку вибирайте для художнього друку чи контрактної кольоропроби.\n"
      tooltip_title: Якість профілю (-q)
    -r:
      name: Згладжування / шум пристрою (% ΔE)
      tooltip_body: 'Оцінка середнього шуму вимірювання чи пристрою у відсотках від ΔE.

        Більші значення посилюють згладжування профілю й зменшують вплив

        патчів-викидів.

        • 0.5%: чисті вимірювання, доглянутий принтер

        • 1.0–2.0%: вимірювання з шумом або фактурний папір

        • 3.0–5.0%: дуже шумно; помітно посилює згладжування

        '
      tooltip_title: Середній шум пристрою (-r)
    -s:
      name: Джерело гамуту (перцептивний)
      tooltip_body: 'Вихідний профіль ICC, за яким обчислюються таблиці відображення

        гамуту для перцептивного наміру відтворення (перцептивні A2B /

        B2A).

        Без нього перцептивний намір напряму використовує колориметричні

        дані (без стиснення гамуту).

        Зазвичай це стандартний робочий простір RGB, як-от AdobeRGB чи

        ProPhoto RGB.

        Приймаються і файли .icc, і .icm — ICM просто назва формату

        профілю ICC у Microsoft, файли однакові.

        '
      tooltip_title: Джерело відображення гамуту для перцептивного наміру (-s)
  printcal:
    -A:
      name: Виробник
      tooltip_body: 'Задає назву виробника, що записується у файл .cal.

        Лише для довідки — на калібрувальні криві не впливає.

        '
      tooltip_title: Виробник (-A)
    -C:
      name: Авторське право
      tooltip_body: 'Задає рядок авторського права, що записується у файл .cal.

        Лише для довідки — на калібрувальні криві не впливає.

        '
      tooltip_title: Авторське право (-C)
    -D:
      name: Опис
      tooltip_body: 'Задає зрозумілий людині опис, що записується у файл .cal.

        Лише для довідки — на калібрувальні криві не впливає.

        '
      tooltip_title: Опис (-D)
    -M:
      name: Модель
      tooltip_body: 'Задає назву моделі принтера, що записується у файл .cal.

        Лише для довідки — на калібрувальні криві не впливає.

        '
      tooltip_title: Модель (-M)
    -s:
      name: Згладжування кривих
      tooltip_body: 'Задає, наскільки сильно додатково згладжуються калібрувальні

        криві. Більші значення дають плавніші, але менш точні криві.


        **Типово:** 1.0 — підходить більшості принтерів.

        Збільште (наприклад, до 2.0–5.0), якщо тонова характеристика

        принтера шумна або калібрувальні криві виглядають нерівними.

        '
      tooltip_title: Згладжування кривих (-s)
    -v:
      name: Докладність виводу
      tooltip_body: "Задає, скільки printcal виводить під час калібрування.\n  0 = нічого\n  1 = основний перебіг (типово)\n  2 = докладно для кожного каналу\n  3 = налагоджувальний вивід\n"
      tooltip_title: Докладність виводу (-v)
    -z:
      name: Роздільність кривої
      tooltip_body: 'Кількість кроків у вихідних таблицях калібрувальних кривих.

        Більші значення дають тоншу роздільність, але більші файли .cal.

        Типове значення (256) підходить практично для всіх принтерів.

        '
      tooltip_title: Роздільність кривої (-z)
  printtarg:
    -A:
      name: Масштаб лише роздільників
      tooltip_body: 'Застосовує додатковий коефіцієнт масштабу лише до

        смужок-роздільників, не змінюючи розмірів патчів, заданих -a.

        Значення понад 1.0 роблять роздільники ширшими, менші за 1.0 —

        вужчими. Корисно для приладів, яким потрібен більший проміжок між

        смугами, або коли хочете виграти місце, звузивши роздільники за

        незмінного розміру патчів.


        Не діє, коли ввімкнено «Без роздільників» (-n): тоді цей параметр

        стає сірим і не додається до команди printtarg.

        '
      tooltip_title: Масштаб лише роздільників (-A)
    -C:
      name: Вимкнути стиснення TIFF
      tooltip_body: 'Записує нестиснені файли TIFF замість типового стиснення LZW.

        Нестиснені файли більші, зате їх приймають усі RIP і драйвери

        принтерів.

        Увімкніть це, якщо ваш процес друку не приймає стиснених TIFF або

        псує їх.

        '
      tooltip_title: Вимкнути стиснення TIFF (-C)
    -D:
      name: Дизеринг 8 біт із 16 біт
      tooltip_body: 'Коли створюється 8-бітовий TIFF, для зменшення внутрішньої

        16-бітової точності використовується дизеринг із розсіюванням

        похибки. Це зменшує смуги на плавних переходах, які інакше

        з’явилися б через квантування.

        Діє, лише коли вибрано 8-бітовий вивід TIFF.

        '
      tooltip_title: Дизеринг 8-бітового виводу (-D)
    -I:
      name: Лише вбудувати .cal
      tooltip_body: 'Використовуйте це, коли ваш принтер чи RIP уже сам застосовує

        калібрувальну криву, наприклад виробничий струменевий RIP із

        власною таблицею лінеаризації або принтер із вбудованим

        калібруванням за щільністю.


        У такому разі вам не потрібно, щоб printtarg перераховував

        значення патчів (це робить сам принтер), але потрібно, щоб colprof

        знав про калібрування. -I вкладає файл .cal у вихідний .ti2 лише

        як метадані, не змінюючи жодного значення патчів.


        **Не натискайте потім «Застосувати калібрування» для профілю.**

        Принтер уже застосовує калібрування, і якщо додати його ще й у

        профіль, колір буде виправлено двічі.


        **Типове застосування:** професійні струменеві RIP (наприклад, EFI

        Fiery, Wasatch, ColorBurst) або принтери з вбудованою

        лінеаризацією, увімкненою під час друку діаграми профілювання.


        Взаємовиключний із «Застосувати .cal» (-K): одночасно може діяти

        лише один параметр калібрування.

        '
      tooltip_title: Додати калібрування без застосування (-I)
    -K:
      name: Застосувати .cal
      tooltip_body: 'Використовуйте це, коли ваш принтер не має власної системи

        калібрування, тобто драйвер принтера чи RIP не вміє сам

        застосувати калібрувальну криву.


        Спершу ви запускаєте printcal з Argyll, щоб отримати файл .cal,

        який описує, як лінеаризувати принтер. Потім передаєте цей .cal

        сюди: printtarg перераховує значення кольору кожного патча через

        калібрувальні криві ще до створення діаграми, тож надрукована

        мішень уже відображає відкалібровану поведінку пристрою. Файл .cal

        також записується в діаграму, тож ліміти чорнила профілю

        обчислюються за справжніми кількостями чорнила.


        **Коли побудуєте профіль, натисніть «Застосувати калібрування».**

        colprof з ArgyllCMS не вкладає калібрування в профіль. Це робить

        «Застосувати калібрування» (applycal), тож кожен відбиток через

        відкалібрований профіль теж буде відкалібрований. Без цього ваші

        відбитки виходять без калібрування.


        **Типове застосування:** настільні струменеві принтери без

        вбудованої лінеаризації, яким TIFF передається напряму, без

        проміжного RIP.


        Взаємовиключний із «Лише вбудувати .cal» (-I): одночасно може

        діяти лише один параметр калібрування.

        '
      tooltip_title: Застосувати калібрування до патчів (-K)
    -L:
      name: Без лівого поля затискача
      tooltip_body: 'Прибирає смугу поля для затискача паперу біля лівого краю й

        звільняє ~15 мм ширини сторінки для додаткових стовпців патчів.

        Увімкніть це, якщо не користуєтеся фізичним затискачем сторінки.

        Усі значення в базі даних патчів розраховано з увімкненим цим

        параметром.

        '
      tooltip_title: Без лівого поля затискача (-L)
    -N:
      name: Додаткові чорнила як альфа-канали
      tooltip_body: 'Лише для діаграм із понад чотирма чорнилами й лише якщо цього

        вимагає програма, якій ви передаєте TIFF.


        TIFF указує, що містять його перші канали, але не має стандартного

        способу назвати п’яте, шосте чи сьоме чорнило. Цей параметр

        позначає додаткові канали як «альфа»-канали — саме таку позначку

        шукають деякі RIP.


        У БУДЬ-ЯКОМУ РАЗІ У ФАЙЛ ЗАПИСУЄТЬСЯ КОЖНЕ ЧОРНИЛО. Змінюється

        лише те, як їх позначено, а не їхній вміст, і власному друку

        ChromIQ це не потрібно.


        Не вмикайте цього, якщо документація вашого RIP прямо не просить

        позначати додаткові чорнила. Деякі програми сприймають альфа-канал

        як прозорість, а не як чорнило, тож якщо ввімкнути це навмання,

        шкоди може бути більше, ніж користі.

        '
      tooltip_title: Позначити додаткові чорнила як альфа-канали (-N)
    -P:
      name: Не обмежувати довжину смуги
      tooltip_body: 'Типово printtarg обмежує довжину смуги так, щоб кожна смуга

        вміщалася на папері. Цей параметр знімає обмеження й дозволяє дуже

        довгі смуги.

        Корисно для вузького рулонного паперу або коли для заданої

        кількості патчів потрібно якомога менше смуг.

        Увага: за великої кількості патчів смуги можуть вийти за край

        паперу — перевірте створений TIFF перед друком.

        '
      tooltip_title: Не обмежувати довжину смуги (-P)
    -Q:
      name: Квантування до бітів
      tooltip_body: 'Перед створенням діаграми округлює всі значення кольору патчів до

        заданої бітової глибини. Наприклад, -Q 8 округлює всі значення до

        8-бітової точності (256 рівнів).

        Використовуйте це, коли ваш ланцюжок друку дає смуги на певній

        бітовій глибині, і ви хочете перевірити саме таку точність.

        '
      tooltip_title: Квантування значень патчів (-Q)
    -R:
      name: Зерно перемішування
      tooltip_body: 'Задає початкове зерно для алгоритму перемішування патчів.

        Те саме зерно з тією самою кількістю патчів завжди дає ту саму

        розкладку патчів, тож діаграми повністю відтворювані.

        Корисно для досліджень або коли згодом треба створити ідентичну

        діаграму.

        Не діє, коли ввімкнено «Зберігати порядок патчів» (-r).

        '
      tooltip_title: Зерно перемішування (-R)
    -U:
      name: Без заголовка керування кольором CUPS
      tooltip_body: 'Прибирає коментар ''cupsJobTicket: cups-disable-cmm'' з вихідних

        файлів PostScript та EPS. Деякі версії CUPS реагують на цей

        коментар по-різному.

        Діє лише на вивід PS/EPS і не впливає на файли TIFF. Вмикайте,

        лише якщо під час друку несподівано застосовується керування

        кольором.

        '
      tooltip_title: Без заголовка CMM для CUPS (-U)
    -a:
      name: Масштаб розміру патча
      tooltip_body: 'Рівномірно масштабує розміри патчів і роздільників.

        1.0 — типове значення (розмір, оптимальний для приладу).

        Збільште до 1.5–2.0 на шорсткому чи фактурному папері, де приладу

        потрібна більша площа вимірювання.

        Значення менше 1.0 вміщує більше патчів на сторінку, але на деяких

        приладах може спричиняти помилки зчитування.

        Примітка: якщо змінити типове значення, замість швидкого пошуку в

        таблиці запускається перерахунок двійковим пошуком.

        '
      tooltip_title: Масштаб розміру патча (-a)
    -b:
      name: Чорно-білі роздільники
      tooltip_body: 'Примусово робить роздільники між смугами чорно-білими замість

        кольорових. На кількість патчів і геометрію розкладки не впливає.


        Не діє, коли ввімкнено «Без роздільників» (-n): тоді цей параметр

        стає сірим і не додається до команди printtarg.

        '
      tooltip_title: Примусово чорно-білі роздільники (-b)
    -c:
      name: Кольорові роздільники
      tooltip_body: 'Примусово робить роздільники між патчами кольоровими, а не

        типовими (вони можуть бути чорно-білими залежно від профілю

        приладу). На деяких кольорових струменевих пристроях, де чорні

        роздільники погано контрастують із темними патчами, це покращує

        розпізнавання смуг.

        '
      tooltip_title: Примусово кольорові роздільники (-c)
    -h:
      name: Подвійна щільність
      tooltip_body: "Змінює щільність патчів у смузі в розкладці printtarg.\nЩо саме це означає, залежить від вибраного приладу:\n\n  •  ColorMunki / i1Studio / ColorChecker Studio — удвічі збільшує\n     кількість патчів, що вміщуються в кожну смугу вимірювання.\n     ПОТРЕБУЄ фізичної вимірювальної напрямної; без неї прилад не\n     вирівняється за щільнішим кроком і зчитуватиме з помилками.\n\n  •  SpectroScan — перемикає розкладку діаграми з прямокутних на\n     шестикутні патчі. Шестикутники лягають щільніше, тож на аркуш\n     уміщується на ~14% більше патчів. Додаткове обладнання не\n     потрібне.\n\nНе діє на i1Pro чи i1Pro 3 Plus і зазвичай прихований, коли\nвибрано один із них.\n"
      tooltip_title: Подвійна щільність (-h)
    -i:
      labels:
      - i1Pro / i1Pro 2 / i1Pro 3
      - i1Pro 3 Plus
      - ColorMunki / i1Studio / ColorChecker Studio
      - SpectroScan (планшетний)
      - CR30 (ChnSpec, по одному патчу)
      - i1iSis (через i1Profiler)
      name: Вимірювальний прилад
      tooltip_body: "Повідомляє генераторові діаграми, яким спектрофотометром ви\nзчитуватимете надруковану діаграму. Сітку патчів побудовано під\nширину смуги, розмір патча й крок цього приладу, тож правильний\nвибір тут дуже важливий.\n\n  •  i1Pro / i1Pro 2 / i1Pro 3: ручний смуговий прилад,\n     найпоширеніший вибір. Зчитує стовпчик патчів за один прохід.\n\n  •  i1Pro 3 Plus: версія i1Pro 3 з більшим отвором. Зчитує більші\n     патчі, тож на аркуш їх уміщується значно менше (~у 5 разів\n     менше, ніж для звичайного i1Pro).\n\n  •  ColorMunki / i1Studio / ColorChecker Studio: прилад\n     початкового рівня. Сам по собі зчитує по одному патчу; з\n     необов’язковою вимірювальною напрямною зчитує їх парами (див.\n     «Подвійна щільність»).\n\n  •  SpectroScan: планшетний XY-сканер. Моторизована рука зчитує\n     кожен патч окремо, тож на аркуш уміщується значно більше\n     кольорів, ніж для будь-якого смугового приладу.\n\n  •  CR30 (ChnSpec): невеликий ручний колориметр, що зчитує ОДИН\n     патч за раз. Ви ставите його на патч і натискаєте кнопку на\n     приладі; ChromIQ записує цей патч і підсвічує наступний.\n     Діаграма — проста сітка з номерами рядів і літерами стовпців,\n     щоб ви знайшли потрібний патч. Розмір патча ПОПЕРЕДНІЙ\n     (квадрати 12 мм — обґрунтована відправна точка, а не\n     виміряний мінімум), а кожен патч — це встановлення й\n     натискання приблизно на дві секунди, тож повний аркуш A4 із\n     ~345 патчами — довга робота. Діаграму для CR30 ЗАВЖДИ\n     розкладає власний рушій макета ChromIQ, і зчитати її може\n     лише ChromIQ: стандартний chartread з ArgyllCMS цього приладу\n     не знає й діаграму не приймає.\n\n  •  i1iSis (через i1Profiler): автоматичний аркушевий прилад,\n     яким ChromIQ керувати не може. Вибирайте його, лише якщо\n     вимірюватимете діаграму в i1Profiler, а вимірювання потім\n     імпортуватимете в ChromIQ, наприклад для звіту про\n     вимірювання. ChromIQ зберігає список патчів поруч із\n     діаграмою у форматі i1Profiler; вкладки «Надрукувати\n     діаграму» й «Виміряти» для цього приладу не використовуються.\n\nЯкщо вибрати не той прилад, вийде діаграма, яку ваш прилад не\nзможе надійно вирівняти чи зчитати, і під час вимірювання ви\nпобачите «патчі не знайдено» чи помилки вирівнювання. У\nпокроковому режимі розкладка підлаштовується під цей вибір\nавтоматично.\n"
      tooltip_title: Вимірювальний прилад (-i)
    -m:
      name: Поле (мм)
      tooltip_body: 'Задає поле в міліметрах і для області друку (-m), і для розмірів

        файлу TIFF (-M). Обидва значення тримаються однаковими.

        6 мм відповідає мінімальним полям більшості принтерів. Зменшуйте,

        лише якщо ваш принтер підтримує друк без полів.


        Під час вибору приладу i1Pro / i1Pro 2 / i1Pro 3 / i1Pro 3 Plus

        поле автоматично збільшується до 10 мм, щоб оптика смугового

        приладу не з’їжджала на голий край паперу (помилки «зчитано замало

        патчів»). Перемикання на ColorMunki / SpectroScan повертає 6 мм.

        Власне значення (будь-яке, крім 6 чи 10) зберігається під час

        зміни приладу.


        Таблиці кількості патчів на сторінку є лише для 6 і 10 мм. Для

        інших значень запускається перерахунок двійковим пошуком.

        '
      tooltip_title: Поле (-m / -M)
    -n:
      name: Без роздільників
      tooltip_body: 'Прибирає всі смужки-роздільники між патчами й смугами. Зазвичай

        роздільники допомагають приладу визначити межі й напрямок смуги.

        Вимикайте роздільники, лише якщо ваш процес вимірювання прямо на

        них не спирається (наприклад, деякі налаштування з планшетним

        сканером).


        Коли це ввімкнено, «Чорно-білі роздільники» (-b) і «Масштаб лише

        роздільників» (-A) автоматично вимикаються, бо обидва стосуються

        лише роздільників.

        '
      tooltip_title: Без роздільників (-n)
    -p:
      labels:
      - A2 книжкова (420 × 594 мм)
      - A2 альбомна (594 × 420 мм)
      - A3+ книжкова (329 × 483 мм)
      - A3+ альбомна (483 × 329 мм)
      - A3 книжкова (297 × 420 мм)
      - A3 альбомна (420 × 297 мм)
      - Tabloid / 11 × 17"
      - Legal (8,5 × 14")
      - A4 книжкова (210 × 297 мм)
      - A4 альбомна (297 × 210 мм)
      - Letter книжкова (8,5 × 11")
      - Letter альбомна (11 × 8,5")
      - 8×10" (203 × 254 мм)
      - 5×7" (127 × 178 мм)
      - 4×6" (102 × 152 мм)
      - 10 × 15 см (100 × 150 мм)
      - Листівка (100 × 148 мм)
      - Власний (введіть розміри)
      name: Розмір паперу
      tooltip_body: "Задає розміри кожного аркуша надрукованої діаграми. Діаграма\nзавжди заповнює сторінку від краю до краю: більший папір уміщує\nбільше патчів, тобто докладніший профіль із меншої кількості\nаркушів.\n\nВибирайте той самий розмір, на якому справді друкуватимете, разом\nз орієнтацією. Смугові прилади (сімейство i1Pro) зчитують згори\nдонизу, тож:\n\n  •  Книжкова: довші смуги, менше їх. Звичайний вибір.\n\n  •  Альбомна (A4R, LetterR, 420×297…): коротші смуги, більше їх.\n     Вибирайте, коли ваш принтер надійніше подає папір в альбомній\n     орієнтації або коли на книжковому аркуші остання смуга\n     опинилася б надто близько до краю.\n\nВиберіть «Власний», щоб ввести точну ширину й висоту в міліметрах,\nколи жоден із названих розмірів не відповідає вашому паперу.\n\nЯкщо змінити розмір паперу, кількість патчів і сторінок у\nпопередньому перегляді команди оновиться автоматично.\n\nПРИНТЕРИ ДЛЯ ФОТО 4 × 6 ДЮЙМІВ\nБагато з них друкують не точно 4 × 6 дюймів (101,6 × 152,4 мм).\nДеякі друкують 10 × 15 см (100 × 150 мм), а принтери листівок,\nяк-от Canon SELPHY, — 100 × 148 мм. Вибирайте розмір, який називає\nвласне налаштування паперу вашого принтера: 4 × 6 дюймів, 10 × 15\nсм чи «Листівка». Якщо не впевнені, подивіться, які розміри паперу\nпропонує його вікно друку. Діаграму, розкладену для трохи більшого\nпаперу, ніж бере принтер, друкують точно в масштабі 100 % без\nжодних питань, якщо за межі паперу виходить лише порожнє поле,\nкінець тонкого рядка дрібного тексту ArgyllCMS уздовж краю чи\nкороткі позначки лінійки. Якщо відрізалося б більше, ChromIQ про\nце скаже й пояснить чому. Тоді через вікно друку macOS чи Windows\nдіаграму не друкують; власним друком ChromIQ її однаково можна\nнадрукувати, але без тієї частини. Краще розкласти діаграму наново\nдля меншого паперу: виберіть тут цей папір і створіть діаграму\nзнову.\n"
      tooltip_title: Розмір паперу (-p)
    -r:
      name: Зберігати порядок патчів (без перемішування)
      tooltip_body: 'Типово printtarg перемішує розташування патчів, щоб зменшити

        артефакти від показань приладу, які повільно змінюються під час

        вимірювання. Вмикайте цей параметр, лише якщо перевіряєте певну

        послідовність патчів або ваш прилад потребує впорядкованих патчів.

        '
      tooltip_title: Без перемішування (-r)
    -t:
      name: Роздільність TIFF (DPI)
      tooltip_body: 'Роздільність вихідних растрових файлів діаграми TIFF.

        300 DPI рекомендовано для смугових приладів: це добрий баланс між

        розміром файлу й чіткістю патчів.

        Для дуже великих діаграм використовуйте 200 DPI, щоб зменшити

        розмір файлу.

        Вищі значення (600+) потрібні рідко й дають великі файли.

        '
      tooltip_title: Роздільність TIFF (-t)
  profcheck:
    -I:
      labels:
      - 'a: Абсолютний колориметричний (типово)'
      - 'r: Відносний колориметричний'
      name: Намір відтворення
      tooltip_body: 'Абсолютний колориметричний перевіряє абсолютну точність кольору

        разом із точкою білого — стандарт для профілювання принтера.

        Відносний колориметричний нормалізує до точки білого носія.

        '
      tooltip_title: Намір відтворення (-I)
    -P:
      name: Відкинути патчі-викиди (ΔE ≤)
      tooltip_body: 'Створює зменшену копію вашого файлу .ti3 лише з тими патчами,

        колірна похибка яких не перевищує заданого порогу.

        Корисно, якщо погано виміряні патчі погіршують профіль.

        Увімкніть цей параметр і задайте найбільше допустиме значення ΔE.

        '
      tooltip_title: Обрізати .ti3 до ΔE ≤ (-P)
    -i:
      labels:
      - D50 (типово)
      - D50M2 (D50 + УФ-фільтр)
      - D65 (денне світло 6500 K)
      - A (лампа розжарювання)
      - C (імітація денного світла, застаріле)
      - F5 (люмінесцентне CWF)
      - F8 (люмінесцентне, імітація D50)
      - F10 (люмінесцентне Ultralume)
      name: Джерело світла
      tooltip_body: 'Вибирає джерело світла, за яким спектральні вимірювання

        перетворюються на значення кольору. Має значення, лише якщо ваш

        .ti3 містить спектральні дані. Для профілювання друку стандартом є

        D50.

        '
      tooltip_title: Джерело світла (-i)
    -o:
      labels:
      - 1931 2° (типово)
      - 1964 10°
      - 2015 2° (Stockman)
      - 2015 10° (Stockman)
      - Shaw & Fairchild
      name: Стандартний спостерігач CIE
      tooltip_body: 'Задає модель стандартного спостерігача для колориметричних

        обчислень.

        Спостерігач 1931 2° — стандарт ICC для профілювання друку.

        Лишайте типове значення, якщо інше прямо не вимагається.

        '
      tooltip_title: Стандартний спостерігач CIE (-o)
    -s:
      name: Сортувати патчі за ΔE (найгірші спершу)
      tooltip_body: 'Сортує вивід profcheck так, щоб найгірші патчі йшли першими.

        Зручно, щоб швидко знайти проблемні ділянки.

        Працює, лише коли докладність виводу — «для кожного патча».

        '
      tooltip_title: Сортувати за ΔE (-s)
    -v:
      labels:
      - '2: Для кожного патча (потрібно для аналізу смуг)'
      - '1: Лише підсумок'
      name: Докладність виводу
      tooltip_body: 'Режим «для кожного патча» виводить окреме значення ΔE кожного

        патча, що потрібно для аналізу смуг і керованого уточнення. Режим

        «лише підсумок» показує тільки середню й пікову похибки.

        '
      tooltip_title: Докладність виводу (-v)
    -w:
      name: Створити тривимірну візуалізацію X3DOM
      tooltip_body: 'Створює інтерактивну тривимірну HTML-візуалізацію колірних похибок

        вашого профілю. Відкрийте отриманий файл .x3d.html у будь-якому

        сучасному браузері, щоб подивитися, у яких частинах колірного

        гамуту похибки найбільші.

        '
      tooltip_title: Візуалізація X3DOM (-w)
  targen:
    -A:
      name: Адаптація OFPS
      tooltip_body: "Наскільки сильно OFPS відходить від правила рівномірного покриття,\nщоб наслідувати форму профілю попереднього кондиціонування (-c).\nМає сенс, лише коли як «Розподіл патчів» вибрано OFPS І задано\nпрофіль -c.\n\n0.0 = повністю ігнорувати профіль — чисто рівномірне покриття\n      в просторі пристрою, ніби -c не задано.\n1.0 = повністю слідувати профілю — зосереджувати патчі там, де,\n      за профілем, гамут принтера цікавий (тобто за формою\n      справжнього колірного простору).\n\nТипово в targen це 0.10 (м’яко) для першого проходу й 1.0, коли\nзадано -c; ChromIQ лишає 0.10, доки ви явно не зміните, щоб\nповедінка несподівано не перемикалася.\n\nЗбільшуйте до 1.0 для проходів уточнення, коли довіряєте першому\nпрофілю й хочете, щоб друга діаграма щільно охоплювала справжній\nгамут принтера, а не порожні кути простору пристрою.\n\nЩоб увімкнути, позначте прапорець.\n"
      tooltip_title: Адаптація OFPS (-A)
    -B:
      name: Чорні патчі
      tooltip_body: "Скільки патчів із максимальною кількістю чорнила (чорний пристрою)\nдодати до діаграми. Прилад вимірює їх, щоб дізнатися найтемніший\nтон, який дає ваш принтер, — на ньому тримається тіньовий кінець\nпрофілю.\nДля принтерів RGB 4 — добре типове значення.\n\n**Авто (прапорець):**\nУвімкніть «Авто», і ChromIQ сам підбере це число залежно від того,\nскільки патчів має вся діаграма: маленька діаграма отримує кілька\nчорних патчів, велика — більше.\n\nЯк обчислюється число «Авто»:\n  • Діаграма з приблизно 560 патчів отримує 4 чорні патчі.\n  • Щоразу, коли діаграма приблизно подвоюється, кількість зростає\n    на 50 % (4 → 6 → 8 …).\n  • Ніколи не більше 8 і не менше 2.\n\nКоли «Авто» ввімкнено, це поле сіре й показує «Авто». Вимкніть\nйого будь-коли, щоб ввести власне число.\n"
      tooltip_title: Чорні патчі (-B)
    -C:
      name: Заміна калібрування
      tooltip_body: 'Необов’язковий файл .cal, калібрувальні криві якого застосовуються

        під час оцінки ліміту чорнила для створення патчів. Має перевагу над

        будь-яким .cal, вкладеним у файл .ti3 попереднього проходу

        профілювання.


        Використовуйте це, коли маєте перевірене калібрування пристрою

        (наприклад, з printcal/applycal) і хочете, щоб targen враховував

        його, обчислюючи, скільки патчів потрібно в тінях.


        Введіть у поле none (без лапок), щоб явно заборонити використання

        будь-якого .cal, навіть вкладеного в .ti3.


        Для більшості процесів лишайте поле порожнім — це потрібно, лише

        коли ви ведете окрему калібрувальну криву незалежно від профілю.

        '
      tooltip_title: Заміна калібрування (-C)
    -D:
      labels:
      - Адитивний
      - Блакитний (Cyan)
      - Пурпуровий (Magenta)
      - Жовтий (Yellow)
      - Чорний (Black)
      - Помаранчевий
      - Червоний
      - Зелений
      - Синій
      - Фіолетовий
      - Білий
      - Світло-блакитний
      - Світло-пурпуровий
      - Світло-жовтий
      - Світло-чорний
      - Середньо-блакитний
      - Середньо-пурпуровий
      - Середньо-жовтий
      - Середньо-чорний
      - Дуже світлий чорний
      name: Додати/прибрати барвник
      tooltip_body: "Змінює набір барвників, заданий «Тип пристрою» (-d), додаючи чи\nприбираючи один окремий барвник. Якщо вибраний барвник уже є в\nнаборі, його буде прибрано; якщо немає — додано.\n\n**Типове застосування:**\n  • Додати помаранчевий (-D 5) до стандартного CMYK для\n    розширеного гамуту\n  • Додати світло-блакитний (-D 11) / світло-пурпуровий (-D 12) до\n    CMYK для плавніших переходів у світлих тонах\n\nУвімкніть кілька слотів, щоб додати кілька барвників (кожен\nувімкнений слот відкриває наступний, загалом до 11 змін).\n\nДля стандартних типів пристроїв 0–5 лишайте це вимкненим.\n"
      tooltip_title: Додати/прибрати барвник (-D)
    -G:
      name: Ретельна оптимізація (повільно)
      tooltip_body: 'targen витрачає більше часу, щоб розставити патчі якомога

        рівномірніше по колірному гамуту принтера. Набір патчів того

        самого типу (OFPS — Optimised Farthest Point Sampling, типовий

        розподіл) у будь-якому разі; цей параметр лише перемикає його з

        режиму «швидко» в режим «якісно».


        Рекомендовано вмикати для кожної діаграми, яку ви справді

        друкуватимете й вимірюватимете: кілька зайвих секунд роботи

        комп’ютера під час створення діаграми дають помітно кращий

        профіль.


        Вимикайте, лише якщо швидко перебираєте налаштування діаграми й

        абсолютна якість патчів не важлива (наприклад, перевіряєте

        розкладку друку, перш ніж узятися за остаточну діаграму).


        Не діє, коли «Розподіл патчів» — не OFPS: інші розподіли

        (випадковий, квазівипадковий, об’ємноцентрований кубічний, …) цей

        параметр ігнорують.

        '
      tooltip_title: Ретельна оптимізація (-G)
    -M:
      name: Кроки на поверхні куба
      tooltip_body: "Додає регулярну сітку патчів на *поверхні* колірного куба принтера\n— N кроків уздовж кожної грані. Патчі стають ззовні (основні\nкольори, вторинні, межа гамуту), але не всередині.\n\n0 (типово) — не додавати.\n\n**Коли це потрібно:**\n  • Коли ви хочете точно зафіксувати межу гамуту й кути\n    основних/вторинних кольорів без зайвих внутрішніх патчів, як з\n    -m.\n  • Щоб порівняти, як різні чорнила чи папери зсувають оболонку\n    гамуту, — поверхневі патчі змінюються найбільше.\n\n**Типові значення:** 4 – 8 кроків на грань.\n\nЩоб увімкнути, позначте прапорець.\n"
      tooltip_title: Кроки на поверхні куба (-M)
    -N:
      name: Акцент на нейтральній осі
      tooltip_body: 'Задає, наскільки сильно патчі скупчуються біля нейтральної осі.

        0.0 = без акценту, 1.0 = найбільше скупчення біля сірого.

        Типове 0.5 підходить для більшості принтерів.

        '
      tooltip_title: Акцент на нейтральній осі (-N)
    -V:
      name: Акцент на темних ділянках
      tooltip_body: "Додає додаткові патчі в темних ділянках (тінях) гамуту.\n1.0 = без акценту (типово). Збільште до 2.0–3.0 для принтерів зі\n  складною поведінкою в тінях (наприклад, на матовому художньому\n  папері).\n"
      tooltip_title: Акцент на темних ділянках (-V)
    -b:
      name: Кроки сітки BCC
      tooltip_body: "Додає патчі на об’ємноцентрованій кубічній (BCC) ґратці —\nщільнішій за просту кубічну сітку, бо точки стоять і в кутах\nкубів, і в їхніх центрах. N — кількість поділок уздовж кожної осі.\n\n0 (типово) — не додавати; це вузькоспеціальне налаштування.\n\n**Коли це потрібно:**\n  • Коли потрібні регулярні, вирівняні за ґраткою позиції патчів,\n    але з кращим пакуванням, ніж дає -m, і без переходу до OFPS.\n  • Для досліджень чи перевірки відтворюваності, де йдеться саме\n    про структуру BCC.\n\n**Примітка:** це форма з *лічильником кроків* (додає до вашого\nсписку патчів); для діаграми, *весь* розподіл якої BCC, виберіть\nвище в «Розподіл патчів» варіант з об’ємноцентрованою кубічною\nґраткою.\n\nЩоб увімкнути, позначте прапорець.\n"
      tooltip_title: Кроки об’ємноцентрованої кубічної сітки (-b)
    -c:
      name: Профіль кондиціонування
      tooltip_body: 'Наявний профіль ICC для цього поєднання принтера й паперу, за яким

        розподіл патчів попередньо налаштовується в просторі сприйняття.

        Якщо вказати тут попередній профіль, патчі розподіляться

        рівномірніше у вихідному гамуті, і другий прохід профілювання буде

        точнішим. Для першого профілю лишайте поле порожнім.

        '
      tooltip_title: Профіль попереднього кондиціонування (-c)
    -d:
      labels:
      - Сірий для друку
      - Сірий для екрана
      - RGB для друку (рекомендовано)
      - RGB для екрана
      - CMYK
      - CMY
      - CMYK + світлі CM
      - CMYK + світлі CMK
      - CMYK + червоний + синій
      - CMYK + помаранчевий + зелений
      - CMYK + червоний + зелений + синій
      - CMYK + помаранчевий + зелений + фіолетовий
      - CMYK + помаранчевий + зелений + синій
      - CMYK + світлі CMK + дуже світлий K
      - CMYK + помаранчевий + зелений + світлі CM
      - CMYK + світлі CM + середні CM
      name: Тип пристрою
      tooltip_body: "Задає поєднання барвників вашого вихідного пристрою.\n\n**Простори друку субтрактивні:** значення пристрою 0 = білий (без\nчорнила), максимум = чорний (повне чорнило). Простори екрана\nадитивні: значення пристрою 0 = чорний, максимум = білий.\n\n**Звичайний вибір:**\n  • Сірий для друку (-d 0)  — одноканальний принтер відтінків\n    сірого\n  • Сірий для екрана (-d 1)  — одноканальний дисплей/монітор\n  • RGB для друку (-d 2)   — звичайний струменевий RGB (типово,\n    рекомендовано)\n  • RGB для екрана (-d 3)   — дисплей/монітор RGB\n  • CMYK (-d 4)        — чотириколірний струменевий принтер чи\n    офсет\n  • CMY (-d 5)         — три кольори, без окремого чорного каналу\n\nВаріанти 6–15 — для спеціальних багатоканальних струменевих\nпринтерів із додатковими чорнилами (світло-блакитне/пурпурове,\nпомаранчеве, зелене, фіолетове тощо).\nЗа потреби точніше налаштуйте набір барвників через -D (експертні\nпараметри).\n"
      tooltip_title: Тип пристрою (-d)
    -e:
      name: Білі патчі
      tooltip_body: "Скільки патчів чистого білого паперу додати до діаграми. Прилад\nвимірює їх, щоб точно дізнатися, наскільки білий ваш папір, — на\nцьому тримається світлий кінець профілю. 4 — добре типове\nзначення; для дуже глянцевого паперу варто кілька більше.\n\n**Авто (прапорець):**\nУвімкніть «Авто», і ChromIQ сам підбере це число залежно від того,\nскільки патчів має вся діаграма: тож маленька односторінкова\nдіаграма отримує кілька білих патчів, а велика багатосторінкова —\nбільше, і думати про це не треба.\n\nЯк обчислюється число «Авто»:\n  • Діаграма з приблизно 560 патчів отримує 4 білі патчі.\n  • Щоразу, коли діаграма приблизно подвоюється, кількість зростає\n    на 50 % (4 → 6 → 8 …).\n  • Ніколи не більше 8 (більше — лише марнування місця) і не менше\n    2.\n\nКоли «Авто» ввімкнено, це поле сіре й показує «Авто». Вимкніть\nйого будь-коли, щоб ввести власне число.\n"
      tooltip_title: Білі патчі (-e)
    -f:
      name: Загальна кількість патчів
      tooltip_body: "Задає загальну кількість кольорових патчів. Більше патчів =\nточніший профіль, але довші друк і вимірювання.\nТипові діапазони для струменевого RGB:\n  • Швидка перевірка: 400–600\n  • Стандарт:         800–1200\n  • Висока якість:    1500–2000\n  • Дуже висока:      2500–3000\n\n**Авто (поруч із полем):** коли позначено, кількість патчів\nобчислюється на льоту з вибраних паперу, приладу, подвійної\nщільності, лівого поля, масштабу патча, поля сторінки й поля\n«Сторінки» в розділі printtarg — береться найбільше значення, що\nзаповнює рівно стільки аркушів без порожнього місця. Поки «Авто»\nввімкнено, поле сіре й показує поточну оцінку. Для власних\nрозкладок (нетиповий масштаб патча чи поле) «Авто» запускає\nкороткий двійковий пошук через targen, тож значення може\nоновлюватися секунду.\n\nУ покроковому режимі це обчислюється автоматично з бази даних\nпатчів на сторінку × вибрана кількість сторінок.\nУ покроковому режимі задайте 0, щоб використати автоматичний\nрозрахунок.\n"
      tooltip_title: Загальна кількість патчів (-f)
    -g:
      name: Кроки сірої осі
      tooltip_body: "Додаткові нейтрально-сірі патчі, рівномірно розставлені від білого\nдо чорного. Вони допомагають профілю чисто відтворювати сірі тони\nбез колірного відтінку — це важливо для чорно-білих фото й\nнейтральних тонів.\nОрієнтовно, якщо задаєте вручну: 0 для швидкого профілю, 50–100\nдля звичайного, 128+ для високої якості.\n\n**Авто (прапорець):**\nУвімкніть «Авто», і ChromIQ сам підбере це число залежно від того,\nскільки патчів має вся діаграма: більша діаграма отримує довшу,\nтоншу сіру шкалу.\n\nЯк обчислюється число «Авто»:\n  • Діаграма з приблизно 560 патчів отримує 32 кроки сірого.\n  • Щоразу, коли діаграма приблизно подвоюється, кількість кроків\n    теж подвоюється (32 → 64 → 128).\n  • Ніколи не більше 128 і не менше 8.\n\nКоли «Авто» ввімкнено, це поле сіре й показує «Авто». Вимкніть\nйого будь-коли, щоб ввести власне число.\n\n(Покроковий режим завжди задає це автоматично за тим самим\nпринципом.)\n"
      tooltip_title: Кроки сірої осі (-g)
    -l:
      name: Ліміт чорнила (%)
      tooltip_body: "Найбільша загальна кількість чорнила, яку принтерові дозволено\nнанести на папір, у відсотках. 100 % = один повний шар чорнила,\n200 % = два повні шари (наприклад, 100C + 100K) і так далі.\n\nЧому це важливо (особливо для CMYK / CMYK+N):\nБез обмеження targen охоче створює патчі на кшталт 100C + 100M +\n100Y + 100K = 400 %. Стільки вологого чорнила може розтікатися,\nдовго сохнути, лягати плямами чи навіть рвати папір — а профіль,\nпобудований з таких патчів, передбачає кольори, яких ваш принтер\nнасправді не дасть.\n\n**Як вибрати значення:**\n  • Більшість струменевих CMYK:        260 – 320 %\n  • Крейдований / глянцевий папір:     320 – 360 %\n  • Газетний, низькоякісний:           220 – 260 %\n  • Розширений гамут (CMYKOGV):        400 – 500 %  (більше чорнил\n    ділять загальний бюджет)\n\nЯкщо не впевнені, подивіться документацію принтера чи рекомендації\nдо профілю паперу або виміряйте самі: надрукуйте невелику тестову\nшкалу ліміту чорнила й виберіть найбільше значення, яке чисто\nвисихає без розтікання.\n\n**Для процесів RGB:** зазвичай лишайте це вимкненим — струменеві\nпринтери RGB самі обмежують чорнило, тож targen не потрібно\nрозподіляти бюджет між каналами.\n\nЩоб увімкнути, позначте прапорець.\n"
      tooltip_title: Загальний ліміт чорнила (-l)
    -m:
      name: Кроки всередині куба
      tooltip_body: "Додає регулярну сітку патчів *усередині* колірного куба принтера —\nN кроків уздовж кожної осі (N×N×N для RGB тощо). Їх розміщують *на\nдодачу* до патчів, вибраних через -f, -g, -s та інші лічильники.\n\n0 (типово) — не додавати; майже завжди це правильний вибір. OFPS і\nтак покриває внутрішність куба ефективніше.\n\n**Коли це потрібно:**\n  • Для відтворюваності між машинами: фіксована сітка щоразу та\n    сама, хоч би які розміщення OFPS вибрав targen, — це допомагає\n    порівнювати профілі між запусками.\n  • Для діагностичних діаграм, де потрібні передбачувані,\n    іменовані позиції в кубі.\n\n**Типові значення:** 3 – 6 (кроків на вісь). Числа швидко\nзростають — 6 кроків у RGB це 216 патчів, 8 — 512.\n\nЩоб увімкнути, позначте прапорець.\n"
      tooltip_title: Кроки всередині куба (-m)
    -n:
      name: Кроки нейтральної осі
      tooltip_body: "Додає патчі шкали вздовж справді нейтральної для ока осі вашого\nпринтера й паперу, як її визначає профіль попереднього\nкондиціонування, завантажений через -c.\n\nЧим це відрізняється від -g («Кроки сірої осі»):\n  • -g іде значеннями пристрою RGB (R = G = B): 0/0/0, 32/32/32,\n    64/64/64 … Це припускає, що однакові значення пристрою\n    друкуються нейтрально-сірими, а так буває лише на ідеально\n    лінеаризованому принтері. На справжньому принтері «сіра шкала\n    пристрою» зазвичай має колірний відтінок.\n  • -n питає наданий профіль: «які значення RGB потрібні САМЕ\n    ЦЬОМУ принтерові, щоб відтворити нейтральний патч L*a*b* (a* =\n    b* = 0) на кожному кроці світлоти?» Ці (зазвичай неоднакові)\n    значення RGB і додаються як патчі.\n\nЧим це відрізняється від -N («Акцент на нейтральній осі»):\n  • -N — це регулятор 0–1, що зсуває наявний розподіл патчів OFPS\n    до нейтральної ділянки. Іменованих кроків він не додає.\n  • -n додає явні нейтральні патчі, виведені з профілю, понад усе,\n    що дає решта розподілу.\n\n**Коли це потрібно:**\n  • Коли у вас уже є профіль ICC першого проходу для цього паперу\n    і ви будуєте діаграму уточнення. Завантажте цей профіль у\n    «Профіль кондиціонування» (-c), а потім задайте -n 32–64, щоб\n    щільно охарактеризувати виправлену нейтральну вісь.\n  • Для першої діаграми без -c лишайте 0 — без профілю\n    попереднього кондиціонування немає «справжньої» нейтральної\n    осі, з якої брати зразки, а -g уже покриває шкалу простору\n    пристрою.\n\n**Типові значення для уточнення:** 32 для звичайної роботи, 64 для\nхудожнього друку чи кольоропроби, де нейтральність критична.\n\nПотребує заданого -c; інакше не діє.\n"
      tooltip_title: Кроки нейтральної осі (-n)
    -s:
      name: Кроки окремих каналів
      tooltip_body: 'Додає додаткові патчі шкал окремих каналів (R, G, B окремо).

        Корисно, щоб охарактеризувати поведінку окремих чорнил.

        Типово: 0 для швидкого, 20–50 для звичайного, 50–100 для високої

        якості.

        '
      tooltip_title: Кроки окремих каналів (-s)
    __targen_distribution__:
      labels:
      - 'OFPS: оптимізована найвіддаленіша точка (рекомендовано)'
      - 'Інкрементна віддалена точка (-t): швидше, менш рівномірно'
      - 'Рівномірно випадковий: простір пристрою (-r)'
      - 'Рівномірно випадковий: простір сприйняття (-R)'
      - 'Квазівипадкове заповнення: простір пристрою (-q)'
      - 'Квазівипадкове заповнення: простір сприйняття (-Q)'
      - 'Об’ємноцентрована кубічна ґратка: простір пристрою (-i)'
      - 'Об’ємноцентрована кубічна ґратка: простір сприйняття (-I)'
      name: Розподіл патчів
      tooltip_body: 'Як targen вирішує, де в гамуті принтера розмістити кожен

        кольоровий патч. Різні алгоритми по-різному поєднують покриття,

        рівномірність і швидкість.


        Виберіть ОДИН. Вони взаємовиключні — будь-який з них повністю

        замінює типове розміщення OFPS.


        **OFPS (типово, рекомендовано):**

        Optimised Farthest Point Sampling. Покроково ставить кожен новий

        патч якомога далі від усіх наявних, даючи найрівномірніше покриття

        з усіх алгоритмів тут. Повільніший за інші, але це еталон якості

        профілю. Для найкращого результату поєднуйте з «Ретельна

        оптимізація (повільно)» (-G).


        **Інкрементна віддалена точка (-t):**

        Простіший метод найвіддаленішої точки. Швидший за OFPS, трохи менш

        рівномірний. Вибирайте, коли OFPS надто повільний для дуже великої

        кількості патчів і ви згодні на невелику втрату якості.


        **Випадковий — простір пристрою (-r):**

        Рівномірно випадкові патчі в сирих значеннях пристрою (наприклад,

        RGB). Найшвидший, але в *сприйнятих* кольорах покриття

        нерівномірне — патчі марнуються там, де око ледь бачить різницю.


        **Випадковий — простір сприйняття (-R):**

        Рівномірно випадковий у сприйнятих кольорах (Lab). Кращий за -r,

        якщо вже потрібен випадковий розподіл, бо патчі розподілено

        рівномірно за тим, що бачить око. Але за тієї самої кількості

        гірший за OFPS.


        **Квазівипадкове заповнення (-q / -Q):**

        Послідовності з низькою розбіжністю (на кшталт Соболя), що

        заповнюють простір рівномірніше за справжній випадковий розподіл,

        без ітеративної вартості OFPS. -q у просторі пристрою, -Q у

        просторі сприйняття. Добрий компроміс, коли OFPS надто повільний.


        **Об’ємноцентрована кубічна ґратка (-i / -I):**

        Фіксована регулярна ґратка (кожен патч оточений 8 сусідами за

        кубічним візерунком). Детермінована й дуже рівномірна, але

        негнучка — точні кількості патчів, що вписуються в ґратку,

        обмежені. -i у просторі пристрою, -I у просторі сприйняття.


        Більшості користувачів варто лишити OFPS.

        '
      tooltip_title: Розподіл патчів (-t / -r / -R / -q / -Q / -i / -I)

parameters:
  applycal:
    -v:
      name: Багатослівний
      tooltip_body: 'Друкує детальну інформацію про застосоване калібрування,

        включаючи статистику кривої для кожного каналу.'
      tooltip_title: Багатослівний (-v)
  chartread:
    -B:
      name: Вимкнути розпізнавання двонаправленої смуги
      tooltip_body: 'Зупиняє автоматичне визначення того, чи сканували ви смужку

        вперед або назад. ChromIQ не вимкнено за умовчанням, тому

        прилад може читати смужки в будь-якому напрямку.


        Вмикайте його, лише якщо ваш прилад повідомляє про помилковий напрямок смуги

        помилки під час вимірювання.

        '
      tooltip_title: Вимкнути двонаправлене читання (-B)
    -H:
      name: Спектральний режим високої роздільної здатності
      tooltip_body: 'Забезпечує спектральну дискретизацію високої роздільної здатності на приладах, які

        підтримувати його (наприклад, i1Pro 2/3).  Видає точніші лабораторні значення

        але трохи збільшує час вимірювання.

        '
      tooltip_title: Спектр високої роздільної здатності (-H)
    -N:
      name: Вимкнути початкове калібрування
      tooltip_body: 'Пропускає автоматичне калібрування білої плитки приладу під час запуску.

        Використовуйте це, лише якщо ви вже відкалібрували прилад

        цього сеансу та хочете вимірювати додаткові діаграми без

        повторне калібрування.

        '
      tooltip_title: Вимкнути початкове калібрування (-N)
    -S:
      name: Придушити попередження
      tooltip_body: 'Пригнічує нефатальні діалогові вікна попереджень про вимірювання в діаграмі.

        Рекомендовано для сеансів вимірювання без нагляду або пакетних вимірювань.

        Про помилки, які перешкоджають створенню профілів, все ще повідомляють.

        '
      tooltip_title: Прибрати попередження (-S)
    -T:
      name: Толерантність консистенції пластиру
      tooltip_body: 'Множник вбудованого порогу узгодженості патчів chartread —

        не значення дельта-E. chartread перечитує кожен патч і відхиляє

        смужки, де показання розходяться більше, ніж порогове значення ×

        цей номер.


        Нижче = суворіше. Суворе налаштування рано виявляє реальні проблеми:

        забиті струменеві сопла, низький рівень чорнила, брудні ролики барабана, стікання

        лазерний тонер. На справній комбінації принтер + спектрофотометр

        значення за замовчуванням 0,7 залишає комфортний запас; досвідчених користувачів

        на printerknowledge.com запустіть 0.4 з i1 Pro 2 / 3.


        Збільште до 0,8–1,5, якщо ви отримуєте помилкові помилки «невідповідний патч».

        фактурний, матовий або художній папір — сама поверхня

        вносить туди реальну дисперсію. Значення вище 2 переважно маскують

        справжні питання; якщо вони вам потрібні, спочатку відремонтуйте принтер.

        '
      tooltip_title: Множник допуску до виправлення (-T)
    -X:
      name: Матриця корекції колориметра
      tooltip_body: 'Застосовує матрицю корекції колориметра (.ccmx) або калібрування

        спектральний набір (.ccss) для підвищення точності колориметра.

        Доречно лише для колориметрів (не спектрофотометрів).

        Отримайте правильний файл у виробника приладу або

        створіть його за допомогою інструментів ArgyllCMS ccss/ccmx.

        '
      tooltip_title: Матриця корекції колориметра (-X)
    -b:
      name: Примусове двонаправлене розпізнавання смуги
      tooltip_body: 'Примусово приймає смужку, скановану в будь-якому напрямку.


        Зазвичай діаграма автоматично визначає лише напрямок смуги у випадковому порядку

        діаграми; на діаграмі з фіксованим порядком він читається лише в одному напрямку і

        відхиляє смужки, скановані назад. Увімкніть це, щоб примусово

        виявлення незалежно — корисно для сімейства i1 Pro, яке читає

        в будь-якому випадку. Це протилежність -B; лише один може подати заявку.

        '
      tooltip_title: Примусове двонаправлене читання (-b)
    -l:
      name: Збережіть D50 L*a*b* Значення
      tooltip_body: 'Зберігає дані вимірювань як значення D50 L*a*b* замість XYZ.

        Більшість робочих процесів використовують XYZ (за замовчуванням).  Увімкнути, лише якщо вниз по течії

        інструменти спеціально вимагають введення L*a*b*.

        '
      tooltip_title: Зберегти L*a*b* замість XYZ (-l)
    -p:
      name: Режим патч-за-патчем
      tooltip_body: 'Перемикається зі зчитування смужок на вимірювання окремих ділянок.

        Корисно для одиночних ручних вимірювань або для зчитування смуг

        не вдається на певному папері.  Значно повільніше для великих

        діаграми.

        '
      tooltip_title: Режим патч-за-патчем (-p)
  colprof:
    -A:
      name: Виробник
      tooltip_body: 'Рядок виробника, вбудований у заголовок профілю ICC.

        Необов’язково — використовується для ідентифікації в інтерфейсі користувача вибору профілю.

        '
      tooltip_title: Рядок виробника (-A)
    -C:
      name: Авторське право
      tooltip_body: 'Повідомлення про авторські права, вбудоване в профіль ICC.

        '
      tooltip_title: Рядок авторського права (-C)
    -D:
      name: Опис профілю
      tooltip_body: "Ім’я, вбудоване в профіль ICC — відображається в управлінні кольором\nменю в таких програмах, як Photoshop, Lightroom і Preview.\n\nВикористовуйте узгоджений формат, який визначає принтер, папір, тип чорнила,\nі дату, щоб потім легко було знайти правильний профіль:\n\n  Принтер · Папір · Тип чорнила · Дата\n  напр. \"Epson P900 · Canson Baryta · Chromatic · 2026-04\"\n\nВихідний файл названо на честь вашого файлу .ti3 — збережіть цю назву\nвідповідає опису, використовуючи підкреслення замість пробілів:\n  напр. EpsonP900_CansonBaryta_Chromatic_2026-04.icc\n"
      tooltip_title: Опис профілю (-D)
    -M:
      name: Модель
      tooltip_body: 'Рядок моделі, вбудований у заголовок профілю ICC.

        '
      tooltip_title: Рядок моделі (-M)
    -S:
      name: Джерело відображення гами (відчуття + насиченість)
      tooltip_body: 'Подібно до -s, але застосовує відображення гами як до перцептивного

        і наміри відтворення насиченості.

        '
      tooltip_title: Джерело сприйняття + насиченість (-S)
    -V:
      name: Виділення сітки темної області
      tooltip_body: 'Додає додаткові точки сітки clUT у темних (тіньових) областях.

        1.0 = рівномірна сітка (за замовчуванням).  Збільшити до 1,5–2,0 фор

        принтери зі складною поведінкою тіней або блокуванням чорного кольору.

        '
      tooltip_title: Виділення сітки темної області (-V)
    -a:
      labels:
      - 'l: Лабораторія cLUT (рекомендовано для принтерів RGB)'
      - 'x: XYZ cLUT'
      name: Алгоритм профілю
      tooltip_body: "Вибирає алгоритм перетворення кольору:\n• Lab cLUT (-al): Найкраща точність для профілів принтера.\n  Використовує повну 3D таблицю пошуку в просторі L*a*b*.  Рекомендовано.\n• XYZ cLUT (-ax): Подібно до Lab, але в просторі XYZ.\n  Іноді створює більш плавні нейтральні градієнти.\nТретього вибору немає: ArgyllCMS створює профіль принтера\nлише як таблиця пошуку та відмовляється від гами, формувача та\nматричні моделі для одного. Вони підходять для сканера, фотоапарата або a\nна дисплеї, а ChromIQ пропонує їх у вікні сканера.\nЗавжди використовуйте Lab cLUT (-al) для перших профілів принтера RGB.\n"
      tooltip_title: Алгоритм профілю (-a)
    -b:
      labels:
      - Якість профілю (за замовчуванням)
      - 'l: Низький'
      - 'м: Середній'
      - 'h: Високий'
      - 'u: Ультра'
      - 'n: Немає (пропустіть таблиці B2A)'
      name: Якість столу B2A
      tooltip_body: 'Самостійно контролює якість B2A (пристрій→PCS)

        таблиці, що використовуються для вхідних (наприклад, перевірочних) перетворень.

        Залиште поле порожнім, щоб відповідати основному параметру якості -q.

        Використовуйте "n", щоб пропустити таблиці B2A та зменшити розмір файлу профілю

        (профілі лише для виводу не потребують B2A).

        '
      tooltip_title: Якість таблиці B2A (-b)
    -ni:
      name: Без вхідних формуючих кривих
      tooltip_body: 'Вимикає криві одновимірного формування (тону) введення, які є попередньою умовою

        значення пристрою перед 3D clUT.  Ці криві нормально

        підвищити точність профілю.  Вимкнути лише для діагностичних цілей.

        '
      tooltip_title: Без вхідних формуючих кривих (-ni)
    -no:
      name: Немає вихідних формуючих кривих
      tooltip_body: 'Вимикає криві формувача 1D виводу, застосовані після 3D clUT.

        Вимкнути лише для діагностичних цілей.

        '
      tooltip_title: Немає вихідних формуючих кривих (-ні)
    -q:
      labels:
      - 'l: низький (швидкий, ~30 с)'
      - 'm: Середній (рекомендовано, ~2 хв)'
      - 'h: Високий (~10 хв)'
      - 'u: Ultra (~30+ хв)'
      name: Якість профілю
      tooltip_body: 'Керує роздільною здатністю сітки CLUT і ітераціями згладжування:

        • Низька: сітка 17³ — швидкий тест, не для виробництва

        • Середній: сітка 33³ — хороший баланс, рекомендовано за замовчуванням

        • Висока: сітка 45³ — якість виробництва

        • Ультра: сітка 65³ — максимальна точність, дуже повільно

        Середньої якості достатньо для більшості струменевих робіт.

        Використовуйте High для образотворчого мистецтва або додатків для перевірки контрактів.

        '
      tooltip_title: Якість профілю (-q)
    -r:
      name: Згладжування / шум пристрою (% ΔE)
      tooltip_body: 'Розрахункове середнє вимірювання або шум пристрою у відсотках

        ΔE.  Вищі значення посилюють згладжування профілю, зменшуючи

        ефект викидних плям.

        • 0,5%: чисті вимірювання, доглянутий принтер

        • 1,0–2,0%: вимірювання з шумом або фактурний папір

        • 3,0–5,0%: дуже шумно; значно збільшує гладкість

        '
      tooltip_title: Середній шум пристрою (-r)
    -s:
      name: Джерело відображення гами (перцептивне)
      tooltip_body: 'Вихідний профіль ICC, який використовується для обчислення сприйнятливого відтворення

        таблиці відображення гами намірів (перцептивні A2B / B2A).

        Без цього перцептивний намір використовує колориметрію

        дані безпосередньо (без стиснення палітри).

        Зазвичай налаштовується на стандартний робочий простір RGB, наприклад

        AdobeRGB або ProPhoto RGB.

        Приймаються як файли .icc, так і .icm — ICM це просто

        Назва Microsoft для формату профілю ICC

        однакові.

        '
      tooltip_title: Джерело відображення сприйнятливої гами (-и)
  printcal:
    -A:
      name: Виробник
      tooltip_body: 'Встановлює опис виробника, вбудований у файл .cal.

        Чисто інформаційно — не впливає на калібрувальні криві.

        '
      tooltip_title: Виробник (-A)
    -C:
      name: Авторське право
      tooltip_body: 'Встановлює рядок авторських прав, вбудований у файл .cal.

        Чисто інформаційно — не впливає на калібрувальні криві.

        '
      tooltip_title: Авторське право (-C)
    -D:
      name: опис
      tooltip_body: 'Встановлює зрозумілий опис, вбудований у файл .cal.

        Чисто інформаційно — не впливає на калібрувальні криві.

        '
      tooltip_title: Опис (-D)
    -M:
      name: Модель
      tooltip_body: 'Встановлює опис моделі принтера, вбудований у файл .cal.

        Чисто інформаційно — не впливає на калібрувальні криві.

        '
      tooltip_title: Модель (-M)
    -s:
      name: Згладжування кривих
      tooltip_body: 'Контролює ступінь додаткового згладжування, застосованого до калібрування

        криві.  Вищі значення дають більш гладкі, але менш точні криві.


        Типове значення: 1.0 — підходить для більшості принтерів.

        Збільште (наприклад, 2,0–5,0), якщо принтер має шумну звукову відповідь

        або калібрувальні криві виглядають нерівними.

        '
      tooltip_title: Згладжування кривих (-s)
    -v:
      name: Багатослівність
      tooltip_body: "Контролює обсяг виведення, який printcal записує під час калібрування.\n  0 = тихо\n  1 = основний прогрес (за замовчуванням)\n  2 = детальна інформація для кожного каналу\n  3 = вихід налагодження\n"
      tooltip_title: Багатослівність (-v)
    -z:
      name: Роздільна здатність кривої
      tooltip_body: 'Кількість кроків у вихідних таблицях калібрувальної кривої.

        Вищі значення дають кращу роздільну здатність, але більші файли .cal.

        Стандартний (256) підходить практично для всіх принтерів.

        '
      tooltip_title: Роздільна здатність кривої (-z)
  printtarg:
    -A:
      name: Шкала лише з прокладкою
      tooltip_body: 'Застосовує додатковий коефіцієнт масштабування лише до прокладок,

        без зміни розмірів латки, встановлених параметром -a.

        Значення вище 1,0 роблять розпірки ширшими; нижче 1,0 зробити їх

        вужчий.  Корисно для інструментів, які потребують додаткового відділення

        між смугами або коли ви хочете звільнити простір шляхом звуження

        прокладки, зберігаючи постійний розмір латки.


        Не має ефекту, якщо ввімкнуто «Без прокладок» (-n) — цей параметр

        виділено сірим кольором і виключено з команди printtarg

        справа.

        '
      tooltip_title: Шкала лише прокладки (-A)
    -C:
      name: Вимкніть стиснення TIFF
      tooltip_body: 'Виводить нестиснуті файли TIFF замість стандартного LZW

        стиснення.  Нестиснуті файли більші, але універсальні

        сумісний з усіма RIP і драйверами принтера.

        Увімкніть це, якщо ваш робочий процес друку відмовляється або спотворюється

        стислі TIFF.

        '
      tooltip_title: Вимкнути стиснення TIFF (-C)
    -D:
      name: Змішування 8-бітного з 16-бітного
      tooltip_body: 'Під час генерації 8-бітного TIFF використовується розсіювання помилок

        щоб знизити вибірку з внутрішньої 16-бітної точності.  Це зменшує

        смуги в плавних градієнтах, які інакше були б спричинені

        квантування.

        Діє лише тоді, коли вибрано 8-бітний вихід TIFF.

        '
      tooltip_title: Дизер 8-бітний вихід (-D)
    -I:
      name: Включити файл калібрування (не застосовується)
      tooltip_body: 'Використовуйте це, якщо ваш принтер або RIP вже застосовує a

        калібрувальна крива — наприклад, виробничий струменевий

        RIP із власною лінеаризацією LUT або принтер із

        вбудоване калібрування щільності.


        У цьому випадку ви не хочете, щоб printtarg перепризначав патч

        значення (принтер обробляє це сам), але ви хочете

        colprof, щоб знати про калібрування.  -Я вбудовую .cal

        у вихідний файл .ti2 лише як метадані, залишаючи всі виправлення

        цінності недоторкані.


        Типове використання: професійні струменеві RIP (наприклад, EFI Fiery,

        Wasatch, ColorBurst) або принтери з вбудованою лінеаризацією

        який активний під час друку профілювання.


        Взаємовиключні з «Застосувати калібрування» (-K) — тільки один

        Параметр калібрування може бути активним одночасно.

        '
      tooltip_title: Включити калібрування без застосування (-I)
    -K:
      name: Застосувати файл калібрування
      tooltip_body: 'Використовуйте це, якщо ваш принтер не має вбудованої системи калібрування

        — тобто драйвер принтера або RIP не може застосувати калібрування

        крива сама по собі.


        Ви спочатку запускаєте printcal Argyll, щоб створити файл .cal, який

        описує, як лінеаризувати принтер.  Тоді ви проходите це

        .cal тут: printtarg змінює кожне значення кольору патча

        калібрувальні криві перед створенням діаграми, тому

        надрукована ціль уже відображає відкалібровану поведінку пристрою.

        .cal також вбудовано у файл .ti2, щоб colprof

        можна посилатися на нього під час створення профілю ICC.


        Типове використання: настільні струменеві принтери без вбудованого

        лінеаризація, керована безпосередньо з TIFF без

        інтервенційний RIP.


        Взаємовиключні з «Включити калібрування» (-I) — тільки

        Одночасно може бути активним один параметр калібрування.

        '
      tooltip_title: Застосувати калібрування до патчів (-K)
    -L:
      name: Прибрати ліву межу кліпу
      tooltip_body: 'Видаляє смужку кордону скріпки з лівого краю, відновлюючи

        ~15 мм ширини сторінки для додаткових колонок з латками.

        Увімкніть це, якщо ви не використовуєте фізичне пристосування для затискання сторінок.

        Усі значення в базі даних виправлень припускають, що цей прапорець увімкнено.

        '
      tooltip_title: Прибрати ліву межу кліпу (-L)
    -N:
      name: Оголосити додаткові чорнила як альфа-канали
      tooltip_body: 'Лише для діаграм із більш ніж чотирма чорнилами, і лише якщо

        програмне забезпечення, якому ви передаєте TIFF, запитує його.


        TIFF повідомляє, які його перші канали, але не має стандарту

        спосіб назвати п’яте, шосте або сьоме чорнило.  Цей параметр позначає

        додаткові як "альфа" канали, що є деяким прапором

        RIPs шукати.


        КОЖНЕ ЧОРНИЛО ЗАПИСУЄТЬСЯ У ФАЙЛ У ТОМУ СПОСІБІ.  Це змінює спосіб

        вони позначені, а не те, що в них є, і власне ChromIQ

        друку це не потрібно.


        Залиште його вимкнутим, якщо документація вашого RIP не вимагає

        додаткові чорнила, які необхідно задекларувати.  Деякі читачі ставляться до альфи

        канал як прозорість, а не чорнило, тож увімкніть його

        наосліп може завдати більше шкоди, ніж залишити це на самоті.

        '
      tooltip_title: Оголосити додаткові чорнила як альфа-канали (-N)
    -P:
      name: Не обмежуйте довжину стрічки
      tooltip_body: 'Типово printtarg обмежує довжину смуги так, щоб кожна смуга

        поміщається в межах паперу без переповнення.  Увімкнення цього прапора

        усуває це обмеження, дозволяючи отримати дуже довгі смуги.

        Корисно для вузького рулонного паперу або коли потрібно якомога менше смужок

        наскільки це можливо для заданої кількості патчів.

        Попередження: якщо кількість патчів велика, смужки можуть витягнутися

        за край паперу — перед тим перевірте створений TIFF

        друк.

        '
      tooltip_title: Не обмежуйте довжину стрічки (-P)
    -Q:
      name: Квантування бітів
      tooltip_body: 'Округлює всі значення кольорів патча, щоб відповідати вказаному

        бітову глибину перед створенням діаграми.  Наприклад, -Q 8

        округлює всі значення до 8-бітної (256-рівневої) точності.

        Використовуйте це, коли ваш конвеєр принтера створює смуги на a

        певну бітову глибину, і ви хочете перевірити саме її

        рівень точності.

        '
      tooltip_title: Квантувати значення патча (-Q)
    -R:
      name: Насіння рандомізації
      tooltip_body: 'Встановлює початкове число для алгоритму рандомізації виправлень.

        Використання того самого насіння з однаковою кількістю патчів завжди дає результат

        той самий макет патча, що робить діаграми повністю відтворюваними.

        Корисно для досліджень або коли вам потрібно відновити

        ідентичну діаграму пізніше.

        Не має ефекту, якщо ввімкнено «Зберегти порядок виправлень» (-r).

        '
      tooltip_title: Начальний елемент рандомізації (-R)
    -U:
      name: Вимкнути заголовок керування кольором CUPS
      tooltip_body: 'Видаляє коментар «cupsJobTicket: cups-disable-cmm».

        Вихідні файли PostScript і EPS.  Деякі версії CUPS реагують

        по-різному від цього коментаря.

        Цей параметр впливає лише на вихід PS/EPS і не впливає на

        файли TIFF.  Увімкніть, лише якщо ви зіткнулися з несподіваним

        керування кольором, що застосовується під час друку.

        '
      tooltip_title: Придушити заголовок CMM CUPS (-U)
    -a:
      name: Шкала розміру патча
      tooltip_body: 'Рівномірно масштабує розміри латки та прокладки.

        1.0 є стандартним (розмір, оптимізований для інструменту).

        Збільште до 1,5–2,0 на грубому/фактурному папері, де

        прилад потребує більшої площі вимірювання.

        Зменшення нижче 1,0 вміщує більше латок на сторінку, але може

        викликають помилки читання на деяких інструментах.

        Примітка: зміна цього значення з тригерів за замовчуванням a

        живе перерахунок бінарного пошуку замість швидкого пошуку.

        '
      tooltip_title: Шкала розміру патча (-a)
    -b:
      name: Force B&W Spacers
      tooltip_body: 'Робить міжсмугові прокладки чорно-білими

        кольоровий.  Не впливає на кількість патчів або геометрію макета.


        Не має ефекту, якщо ввімкнуто «Без прокладок» (-n) — цей параметр

        виділено сірим кольором і виключено з команди printtarg

        справа.

        '
      tooltip_title: Force B&W Spacers (-b)
    -c:
      name: Примусово кольорові розпірки
      tooltip_body: 'Примушує відтворювати кольорові області прокладок між латками

        а не за замовчуванням (що може бути чорно-білим залежно

        на профілі інструменту).  Може покращити розпізнавання смуг

        на деяких кольорових струменевих пристроях, де чорні прокладки мають низький рівень

        контраст проти темних плям.

        '
      tooltip_title: Сильно забарвлені розпірки (-c)
    -h:
      name: Подвійна щільність
      tooltip_body: "Змінює щільність патчів для кожної смуги макета printtarg.\nТочне значення залежить від активного інструменту:\n\n  • ColorMunki / i1Studio / ColorChecker Studio — подвоює\n     кількість патчів, які поміщаються в кожну вимірювальну смужку.\n     ПОТРІБНИЙ аксесуар фізичної вимірювальної установки; без нього\n     пристрій не зможе вирівняти на меншій відстані, і буде\n     неправильно прочитаний.\n\n  • SpectroScan — змінює вигляд діаграми з прямокутного\n     до шестикутних плям. Шестикутники мозаїчні більш щільно, тому\n     ~На 14% більше патчів поміщається на аркуш. Додаткове обладнання не потрібне.\n\nНе впливає на i1Pro або i1Pro 3 Plus і зазвичай приховано\nколи вибрано один із них.\n"
      tooltip_title: Подвійна щільність (-h)
    -i:
      labels:
      - i1Pro / i1Pro 2 / i1Pro 3
      - i1Pro 3 Plus
      - ColorMunki / i1Studio / ColorChecker Studio
      - SpectroScan (планшетний)
      - CR30 (ChnSpec, патч за патчем)
      - i1iSis (через i1Profiler)
      name: Вимірювальний інструмент
      tooltip_body: "Повідомляє генератору діаграм, який спектрофотометр ви будете використовувати\nпрочитайте роздруковану схему. Навколо цього будується сітка патчів\nширина смуги інструменту, розмір патча та відстань — отже\nце право є істотним.\n\n  • i1Pro / i1Pro 2 / i1Pro 3 — портативний стрип-рідер, найбільше\n     загальний вибір. Зчитує колонку патчів одним рухом.\n\n  • i1Pro 3 Plus — версія i1Pro 3 зі збільшеною діафрагмою.\n     Зчитує більші патчі, тому менше вмісту на аркуші (приблизно в 5 разів менше\n     ніж звичайний i1Pro).\n\n  • ColorMunki / i1Studio / ColorChecker Studio — початковий рівень\n     пристрій. Читає один патч самостійно; з\n     додаткова вимірювальна установка, вона об’єднує їх (див. подвійну щільність).\n\n  • SpectroScan — планшетний сканер XY. Моторизована рука читає\n     кожен патч окремо, тому він містить набагато більше кольорів на кожен\n     аркуша, ніж будь-який пристрій для читання смуг.\n\n  • CR30 (ChnSpec) — маленький ручний колориметр, який читає\n     ОДИН патч за раз. Ви кладете його на патч і натискаєте\n     кнопка на інструменті; ChromIQ записує цей патч і\n     виділяє наступний. Діаграма являє собою звичайну сітку з рядками\n     цифри та букви стовпця, щоб ви могли знайти патч\n     попросив. Його розмір патча є ПЕРЕДОВИМ (квадрати 12 мм —\n     аргументована відправна точка, а не виміряний мінімум), і кожен\n     патч – це розміщення та натискання близько двох секунд, тому a\n     повний аркуш формату А4 ~345 патчів — це довго сидіти. Діаграма CR30 є\n     ЗАВЖДИ розміщується власним механізмом компонування ChromIQ і може\n     читати лише за допомогою ChromIQ — це робить стандартне читання діаграм ArgyllCMS\n     не знає цього інструменту і відмовляється від діаграми.\n\n  • i1iSis (через i1Profiler) — автоматичний зчитувач аркушових діаграм.\n     ChromIQ не може безпосередньо керувати цим пристроєм: натомість він буде\n     збережіть список виправлень у власному форматі i1Profiler\n     діаграму, і ви завершуєте робочий процес там (друк, сканування,\n     створити профіль). Вкладки «Друк» і «Вимірювання» ChromIQ – ні\n     використовується для цього пристрою.\n\nВибравши неправильний інструмент, ваш пристрій не зможе створити діаграму\nвирівняйте або читайте надійно — ви побачите «патчі не знайдено» або\nпохибки вирівнювання при вимірюванні. У керованому режимі макет\nавтоматично адаптується до цього вибору.\n"
      tooltip_title: Вимірювальний прилад (-i)
    -m:
      name: Поле (мм)
      tooltip_body: 'Встановлює поле в міліметрах для області друку (-м)

        і розміри файлу TIFF (-M).  Обидва синхронізуються.

        6 мм відповідає мінімальним полям більшості принтерів.  Зменшити тільки якщо

        Ваш принтер підтримує друк без полів.


        Вибір інструменту i1Pro / i1Pro 2 / i1Pro 3 / i1Pro 3 Plus

        автоматично збільшує його до 10 мм, щоб оптика пристрою для зчитування смужок не дрейфувала

        на оголений край паперу (помилка «недостатньо прочитаних патчів»).

        Перехід на ColorMunki / SpectroScan повертає його до 6 мм. А

        настроюване значення (будь-що, крім 6 або 10) зберігається

        зміни інструменту.


        Таблиці пошуку латок на сторінку існують лише для 6 та 10 мм — інше

        значення запускають живий перерахунок бінарного пошуку.

        '
      tooltip_title: Маржа (-m / -M)
    -n:
      name: Без прокладок
      tooltip_body: 'Видаляє всі розпірки між латками та смугами.  Розпірки

        зазвичай допомагають приладу визначити межі смуги та

        напрямок.

        Вимкніть розпірки, лише якщо ваш робочий процес вимірювання явно визначений

        не покладається на них (наприклад, деякі налаштування планшетного сканера).


        Якщо ввімкнено, «Примусово використовувати чорно-білі прокладки» (-b) і «Шкала лише прокладок»

        (-A) автоматично вимикаються, оскільки обидва впливають лише на прокладки.

        '
      tooltip_title: Без пробілів (-n)
    -p:
      labels:
      - A2 Портрет (420 × 594 мм)
      - A2 альбомна (594 × 420 мм)
      - A3+ Портрет (329 × 483 мм)
      - A3+ альбомна (483 × 329 мм)
      - A3 Портрет (297 × 420 мм)
      - A3 альбомна (420 × 297 мм)
      - Таблоїд / 11 × 17"
      - Legal (8,5 × 14 дюймів)
      - A4 Портрет (210 × 297 мм)
      - A4 альбомна (297 × 210 мм)
      - Літерний портрет (8,5 × 11 дюймів)
      - Letter Landscape (11 × 8,5 дюймів)
      - 8 × 10 дюймів (203 × 254 мм)
      - 5 × 7 дюймів (127 × 178 мм)
      - 4 × 6 дюймів (102 × 152 мм)
      - Спеціальний (введіть розміри)
      name: Розмір паперу
      tooltip_body: "Встановлює розміри кожного аркуша на друкованій діаграмі. Діаграма\nзавжди заповнює сторінку від краю до краю — більший папір підходить більше\nпатчі, що означає більш детальний профіль з меншої кількості аркушів.\n\nВиберіть той самий розмір, на якому ви збираєтеся друкувати, включаючи його\nорієнтація. Зчитувачі смуг (сімейство i1Pro) читають зверху вниз, тому:\n\n  • Портрет — довші смуги, їх менше. Стандартний вибір.\n\n  • Пейзаж (A4R, LetterR, 420×297…) — коротші смуги, більше\n     з них. Використовуйте це, якщо ваш принтер більше подає альбомну орієнтацію\n     надійно, або коли портретний аркуш залишиться останнім\n     смуга надто близько до краю паперу.\n\nВиберіть «Власний», щоб ввести точну ширину та висоту в міліметрах\nякщо жоден із названих розмірів не відповідає паперу, який ви використовуєте.\n\nЯкщо ви зміните розмір паперу, кількість патчів і сторінок у\nавтоматичне оновлення попереднього перегляду команди.\n"
      tooltip_title: Розмір паперу (-p)
    -r:
      name: Зберігати порядок виправлень (без рандомізації)
      tooltip_body: 'Типово printtarg рандомізує позиції латок для зменшення

        артефакти дрейфу інструментів.  Увімкніть цей прапорець, лише якщо ви

        тестують певну послідовність патчів або якщо ваш інструмент

        вимагає замовлених патчів.

        '
      tooltip_title: Без рандомізації (-r)
    -t:
      name: Вихід TIFF DPI
      tooltip_body: 'Вихідна роздільна здатність для файлів растрової діаграми TIFF.

        300 DPI рекомендовано для приладів для зчитування смужок і дає

        хороший баланс розміру файлу та чіткості патча.

        Використовуйте 200 DPI для дуже великих діаграм, щоб зменшити розмір файлу.

        Більш високі значення (600+) потрібні рідко і створюють великі файли.

        '
      tooltip_title: Роздільна здатність TIFF (-t)
  profcheck:
    -I:
      labels:
      - 'a: Абсолютний колориметричний (за замовчуванням)'
      - 'r: Відносний колориметричний'
      name: Намір візуалізації
      tooltip_body: 'Абсолютна колориметрія перевіряє абсолютну точність кольору в тому числі

        біла точка — стандартна для профілювання принтера.

        Відносна колориметрія нормалізується до точки білого носія.

        '
      tooltip_title: Намір відтворення (-I)
    -P:
      name: Обрізати викидні ділянки (ΔE ≤)
      tooltip_body: 'Створює зменшену копію вашого файлу .ti3, що містить лише латки

        чия помилка кольору дорівнює або нижче встановленого вами порогу.

        Корисно, якщо погано виміряні плями тягнуть профіль вниз.

        Увімкніть цю опцію та встановіть максимально прийнятне значення ΔE.

        '
      tooltip_title: Обрізати .ti3 до ΔE ≤ (-P)
    -i:
      labels:
      - D50 (за замовчуванням)
      - D50M2 (D50 + УФ-фільтр)
      - D65 (денне світло 6500 K)
      - A (вольфрам / лампа розжарювання)
      - C (сим. денного світла, старше)
      - F5 (флуоресцентний CWF)
      - F8 (люмінесцентний D50 sim.)
      - F10 (флуоресцентний Ultralume)
      name: Освітлювач
      tooltip_body: 'Вибирає джерело світла, яке використовується під час спектрального перетворення

        вимірювань до значень кольорів.  Доречно, лише якщо ваш .ti3

        містить спектральні дані.  D50 є стандартом для друку

        профілювання.

        '
      tooltip_title: Освітлювач (-i)
    -o:
      labels:
      - 1931 2° (за замовчуванням)
      - 1964 10°
      - 2015 2° (Стокман)
      - 2015 10° (Стокман)
      - Шоу і Ферчайлд
      name: Спостерігач CIE
      tooltip_body: 'Визначає стандартну модель спостерігача для колориметричних обчислень.

        1931 2° спостерігач є стандартом ICC для профілювання друку.

        Залиште значення за замовчуванням, якщо інше не вимагається.

        '
      tooltip_title: Спостерігач CIE (-o)
    -s:
      name: Сортувати патчі за ΔE (спочатку найгірші)
      tooltip_body: 'Сортує вихідні дані profcheck таким чином, щоб відображалися найгірші виправлення

        перший.  Корисно для швидкого визначення проблемних зон.

        Ефективно лише тоді, коли для детальності встановлено значення для кожного патча.

        '
      tooltip_title: Сортувати за ΔE (-s)
    -v:
      labels:
      - '2: на патч (потрібно для аналізу смужки)'
      - '1: лише резюме'
      name: Багатослівність
      tooltip_body: 'Режим кожного патча виводить окреме значення ΔE для кожного патча,

        який необхідний для аналізу на рівні стрічки та керованого

        уточнення.  Підсумковий режим показує лише середні та пікові помилки.

        '
      tooltip_title: Багатослівність (-v)
    -w:
      name: Створіть тривимірну візуалізацію X3DOM
      tooltip_body: 'Створює інтерактивну тривимірну HTML-візуалізацію вашого профілю

        колірні помилки.  Відкрийте отриманий файл .x3d.html у будь-якій сучасній програмі

        браузер, щоб дослідити, які частини колірної гами мають

        найбільші помилки.

        '
      tooltip_title: Візуалізація X3DOM (-w)
  targen:
    -A:
      name: Адаптація OFPS
      tooltip_body: "Наскільки сильно OFPS порушує своє правило рівномірного покриття, щоб дотримуватися\nформа профілю попереднього кондиціонування (-c). Лише тоді, коли\nOFPS — це вибране розповсюдження виправлень І встановлено профіль -c.\n\n0,0 = повністю ігнорувати профіль — чисте рівномірне покриття\n      простір пристрою, ніби не вказано -c.\n1.0 = повністю стежити за профілем — концентрувати патчі там, де\n      профіль каже, що гама принтера цікава (тобто\n      форму фактичного колірного простору).\n\nЗа замовчуванням цільове значення становить 0,10 (м’який) для першого проходу та 1,0, коли\n-с встановлено; ChromIQ залишає це значення на рівні 0,10, якщо ви цього не зробили явно\nзмініть його, щоб не отримати несподіваного перемикання поведінки.\n\nЗбільште до 1,0 для проходів уточнення, де ви довіряєте\nперший профіль і потрібно, щоб друга діаграма була щільно вибіркова\nреальну гаму принтера, а не порожні кути простору пристрою.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Адаптація OFPS (-A)
    -B:
      name: Чорні плями
      tooltip_body: "Скільки патчів із максимальним вмістом чорнила (чорний пристрій) додати до діаграми.\nПрилад вимірює їх, щоб дізнатися найтемніший ваш тон\nпринтер може створити, який закріплює тіньовий кінець профілю.\n4 є хорошим за замовчуванням для принтерів RGB.\n\nАвтоматично (прапорець):\nУвімкніть «Авто», і ChromIQ вибере цей номер для вас на основі\nскільки патчів містить вся діаграма — маленька діаграма отримує a\nкілька чорних плям, велика діаграма стає більшою.\n\nЯк розробляється номер Auto:\n  • Діаграма приблизно з 560 плям отримує 4 чорні плями.\n  • Щоразу, коли розмір діаграми приблизно подвоюється, кількість\n    зростає на 50 % (4 → 6 → 8 …).\n  • Він ніколи не перевищує 8 і ніколи не нижче 2.\n\nКоли ввімкнено автоматичний режим, це поле неактивне та відображає «авто». поворот\nйого вимкнути будь-коли, щоб ввести власний номер.\n"
      tooltip_title: Чорні плями (-B)
    -C:
      name: Перевизначення калібрування
      tooltip_body: 'Додатковий файл .cal, калібрувальні криві якого застосовуються під час оцінювання

        ліміт чорнила для створення латок.  Перевизначає будь-який вбудований .cal

        цільовий файл ICC .ti3, створений попереднім проходом профілювання.


        Використовуйте це, якщо у вас є підтверджене калібрування пристрою (наприклад, з

        printcal/applycal) і хочуть, щоб targen враховував це під час обчислень

        скільки патчів потрібно в області тіні.


        Введіть «none» у полі (без лапок), щоб явно заборонити будь-які

        .cal від використання, навіть якщо його вбудовано в .ti3.


        Залиште поле порожнім для більшості робочих процесів — потрібне лише тоді, коли ви керуєте

        окрема калібрувальна крива незалежно від профілю.

        '
      tooltip_title: Перевизначення калібрування (-C)

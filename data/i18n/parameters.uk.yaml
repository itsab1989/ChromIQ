      name: Додати/Видалити барвник
      tooltip_body: "Змінює набір барвників, встановлений типом пристрою (-d), шляхом додавання\nабо видалення окремого барвника.  Якщо обраний барвник є\nвже присутній в наборі видаляється; якщо його немає, додається.\n\nТипове використання:\n  • Додайте помаранчевий (-D 5) до стандартного CMYK для розширення палітри\n  • Додайте світло-блакитний (-D 11) / світло-пурпуровий (-D 12) до CMYK\n    для плавніших градієнтів підсвічування\n\nУвімкніть кілька слотів для складання додаткових барвників (кожен увімкнено\nслот відкриває наступні, до 11 модифікацій).\n\nЗалиште це вимкненим для стандартних типів пристроїв 0–5.\n"
      tooltip_title: Додати/видалити барвник (-D)
    -G:
      name: Ретельна оптимізація (повільна)
      tooltip_body: 'Змушує targen витрачати додатковий час на рівномірне розміщення пластирів

        можливий у всій кольоровій гамі вашого принтера. Набір латок є

        той самий тип (OFPS — оптимізована вибірка найдальшої точки,

        розподіл за замовчуванням) будь-яким способом; це просто перемикає його з

        «швидкий» режим на «хороший».


        Рекомендується ON для будь-якої діаграми, яку ви дійсно збираєтеся роздрукувати

        міра: кілька додаткових секунд комп’ютерного часу під час діаграми

        покоління дає вам помітно кращий профіль.


        Вимкніть, лише якщо ви швидко змінюєте налаштування діаграми та

        не дбають про абсолютну якість патча (наприклад, тестування друку

        макети перед створенням остаточної діаграми).


        Не має ефекту, якщо для параметра «Розповсюдження виправлень» встановлено інше значення

        ніж OFPS — альтернативні розподіли (випадкові, квазівипадкові,

        тілоцентрований куб, …) ігноруйте цей прапор.

        '
      tooltip_title: Ретельна оптимізація (-G)
    -M:
      name: Сходинки поверхні куба
      tooltip_body: "Додає регулярну сітку плям на *поверхню* принтера\nкольоровий куб — N кроків уздовж кожної грані. Патчі йдуть на\nза межами (первинні, вторинні, край гами), але не в\nінтер'єр.\n\nВстановіть 0 (за замовчуванням), щоб пропустити.\n\nКоли його використовувати:\n  • Ви конкретно хочете встановити межу гами та\n    первинні/вторинні кути без внутрішньої верхньої частини\n    з -м.\n  • Порівняння того, як різні чорнило/папір змінюють гаму\n    конверт — найбільше страждають плями на поверхні.\n\nТипові значення при використанні: 4 – 8 кроків на обличчя.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Сходинки поверхні куба (-M)
    -N:
      name: Акцент нейтральної осі
      tooltip_body: 'Контролює, наскільки сильно патчує кластер біля нейтральної осі.

        0,0 = відсутність виділення, 1,0 = максимальне скупчення поблизу сірого.

        Стандартне значення 0,5 підходить для більшості принтерів.

        '
      tooltip_title: Акцент нейтральної осі (-N)
    -V:
      name: Виділення темної області
      tooltip_body: 'Додає додаткові плями в темних (тіньових) областях палітри.

        1.0 = без наголосу (за замовчуванням).  Збільшити до 2,0–3,0 для принтерів

        зі складною поведінкою тіні (наприклад, матовий аркуш паперу).

        '
      tooltip_title: Виділення темної області (-V)
    -b:
      name: Кубічні кроки з центром тіла
      tooltip_body: "Додає плями на об'ємно-центрованій кубічній (BCC) решітці — щільніше\nніж звичайна кубічна сітка, оскільки вона розміщує точки на обох\nкути куба і центри куба. N - кількість\nпідрозділи вздовж кожної осі.\n\nВстановіть 0 (за замовчуванням), щоб пропустити — це ручка ніші.\n\nКоли його використовувати:\n  • Вам потрібні регулярні, вирівняні по решітці позиції латок, але\n    з кращим упакуванням, ніж -m дає, не збираючись усе\n    шлях до ОФПС.\n  • Дослідження / сценарії повторюваності, де структура BCC\n    сама по собі суть.\n\nПримітка: це форма *лічильника кроків* (додає до вашого списку виправлень);\nдля діаграми, *весь* розподіл якої є BCC, використовуйте\nСелектор «Розподіл латок» угорі та оберіть тіло в центрі\nкубічний варіант є.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Кубічні кроки з центром тіла (-b)
    -c:
      name: Профіль попереднього кондиціонування
      tooltip_body: 'Існуючий профіль ICC для цієї комбінації принтер/папір використано

        для попереднього обумовлення розподілу плям у перцептивному просторі.

        Використання попереднього профілю тут створює плями більш рівномірно

        розподіляється у вихідній гамі, що забезпечує кращу точність

        другий прохід профілювання.  Залиште поле порожнім для першого профілю.

        '
      tooltip_title: Профіль попереднього кондиціонування (-c)
    -d:
      labels:
      - Принт сірий
      - Відео сіре
      - Друк RGB (рекомендовано)
      - Відео RGB
      - CMYK
      - CMY
      - CMYK + Light CM
      - CMYK + світлий CMK
      - CMYK + червоний + синій
      - CMYK + оранжевий + зелений
      - CMYK + червоний + зелений + синій
      - CMYK + оранжевий + зелений + фіолетовий
      - CMYK + помаранчевий + зелений + синій
      - CMYK + Light CMK + Light Light K
      - CMYK + оранжевий + зелений + світлий CM
      - CMYK + світлий CM + середній CM
      name: Тип пристрою
      tooltip_body: "Визначає комбінацію кольорів вашого пристрою виводу.\n\nПробіли друку субтрактивні: значення пристрою 0 = білий (без чорнила),\nмаксимум = чорний (повне чорнило).  Відео/дисплеї є додатковими:\nзначення пристрою 0 = чорний, максимум = білий.\n\nПоширені варіанти:\n  • Print gray (-d 0) — одноканальний сірий принтер\n  • Video gray (-d 1) — одноканальний дисплей/монітор\n  • Print RGB (-d 2) — стандартний струменевий RGB (за замовчуванням, рекомендовано)\n  • Video RGB (-d 3) — RGB дисплей/монітор\n  • CMYK (-d 4) — чотириколірний струменевий або офсетний друк\n  • CMY (-d 5) — три кольори, без окремого чорного каналу\n\nВаріанти 6–15 призначені для спеціальних багатоканальних струменевих принтерів із\nдодаткові чорнила (світло-блакитний/пурпуровий, оранжевий, зелений, фіолетовий тощо).\nВикористовуйте -D (Експерт) для точного налаштування набору барвників, якщо необхідно.\n"
      tooltip_title: Тип пристрою (-d)
    -e:
      name: Білі плями
      tooltip_body: "Скільки чистих паперово-білих плям додати до діаграми. The\nінструмент вимірює їх, щоб точно дізнатися, наскільки білий ваш папір\nє, який закріплює світлий кінець профілю. 4 - добре\nзамовчування; дуже глянсовий папір може отримати користь від кількох інших.\n\nАвтоматично (прапорець):\nУвімкніть «Авто», і ChromIQ вибере цей номер для вас на основі\nскільки патчів містить вся діаграма — тому маленька одна сторінка\nдіаграма отримує кілька білих плям, а велика багатосторінкова діаграма отримує\nбільше, без необхідності думати про це.\n\nЯк розробляється номер Auto:\n  • Діаграма приблизно з 560 патчів отримує 4 білі плями.\n  • Щоразу, коли розмір діаграми приблизно подвоюється, кількість\n    зростає на 50 % (4 → 6 → 8 …).\n  • Він ніколи не перевищує 8 (більше просто витрачає простір)\n    і ніколи не нижче 2.\n\nКоли ввімкнено автоматичний режим, це поле неактивне та відображає «авто». поворот\nйого вимкнути будь-коли, щоб ввести власний номер.\n"
      tooltip_title: Білі плями (-e)
    -f:
      name: Загальна кількість патчів
      tooltip_body: "Встановлює загальну кількість кольорових плям.  Більше патчів = краще\nточність профілю, але більший час друку та вимірювання.\nТипові діапазони для струменевого друку RGB:\n  • Швидкий тест: 400–600\n  • Стандарт: 800–1200\n  • Висока якість: 1500–2000\n  • Дуже високий: 2500–3000\n\nАвто (поруч зі списком): якщо позначено, кількість патчів є\nобчислюється в реальному часі з вибраного паперу, інструменту, подвійної щільності,\nліва межа, масштаб виправлення, поле та вікно обертання сторінок у\nрозділ printtarg — вибір найбільшого значення, яке точно заповнюється\nстільки аркушів без жодного пустого місця.  Спинбокс неактивний\nв той час як Авто увімкнено та показує поточну оцінку.  Для замовлення\nмакети (не за замовчуванням масштаб виправлення або поля) Автоматичний запуск\nдвійковий пошук проти targen, тому значення може зайняти секунду\nоновити.\n\nУ керованому режимі це обчислюється автоматично з\nбаза даних латок на сторінку × кількість вибраних сторінок.\nЩоб використовувати автоматичне обчислення, у режимі підказок установіть значення 0.\n"
      tooltip_title: Загальна кількість патчів (-f)
    -g:
      name: Сірі кроки осі
      tooltip_body: "Додаткові нейтральні сірі плями, розташовані рівномірно від білого до чорного.\nВони допомагають профілю відтворювати сірі відтінки чисто, без кольору\ncasts — важливо для чорно-білих фотографій і нейтральних тонів.\nПриблизний посібник, якщо ви налаштуєте його вручну: 0 для швидкого профілю,\n50–100 за стандартну, 128+ за високу якість.\n\nАвтоматично (прапорець):\nУвімкніть «Авто», і ChromIQ вибере це число для вас у масштабі\nскільки патчів містить вся діаграма — більша діаграма отримує a\nдовший, тонший сірий пандус.\n\nЯк розробляється номер Auto:\n  • Діаграма приблизно з 560 патчів отримує 32 сірі кроки.\n  • Кожного разу, коли розмір діаграми приблизно подвоюється, кроки\n    теж подвійний (32 → 64 → 128).\n  • Він ніколи не перевищує 128 і ніколи не опускається нижче 8.\n\nКоли ввімкнено автоматичний режим, це поле неактивне та відображає «авто». поворот\nйого вимкнути будь-коли, щоб ввести власний номер.\n\n(У керованому режимі це завжди встановлюється автоматично, використовуючи ту саму ідею.)\n"
      tooltip_title: Кроки сірої осі (-g)
    -l:
      name: Загальний ліміт чорнила (%)
      tooltip_body: "Максимальна загальна кількість чорнила, яке принтер може нанести\nна папері, у відсотках. 100 % = один повний шар фарби,\n200 % = два повних шари (наприклад, 100C + 100K) і так далі.\n\nЧому це важливо (особливо для CMYK / CMYK+N):\nБез обмежень targen із задоволенням створює патчі на зразок 100C +\n100M + 100Y + 100K = 400 %. Стільки вологого чорнила може стати калюжею, висохнути\nповільно, плямистий або навіть рвати папір — і профіль побудований\nна основі таких патчів передбачити кольори, які ваш принтер насправді не може\nвиробляти.\n\nЯк вибрати значення:\n  • Більшість струменевих принтерів CMYK: 260–320 %\n  • Крейдований/глянцевий папір: 320–360 %\n  • Газетний папір низької якості: 220 – 260 %\n  • Розширена гама (CMYKOGV): 400–500 % (більша частка чорнил)\n                                           загальний бюджет)\n\nЯкщо не впевнені, перевірте документацію принтера або профіль паперу\nвказівки або вимірювання: надрукуйте невеликий тестовий клин для обмеження чорнила та\nоберіть найвище значення, яке чисто висихає без кровотечі.\n\nДля робочих процесів RGB: зазвичай залишають це вимкненим — струменеві принтери RGB\nобробляють власне обмеження чорнила всередині, тому targen цього не робить\nнеобхідно розподілити бюджет між каналами.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Загальний ліміт чорнила (-л)
    -m:
      name: Інтер'єрні сходи Cube
      tooltip_body: "Додає регулярну сітку плям *всередині* кольору принтера\nкуб — N кроків уздовж кожної осі (N×N×N для RGB тощо). Ці\nрозміщуються *на додаток до* вибраних вами патчів\n-f, -g, -s та інші лічильники.\n\nВстановіть 0 (за замовчуванням), щоб пропустити — майже завжди правильний вибір.\nOFPS вже більш ефективно охоплює внутрішню частину куба.\n\nКоли його використовувати:\n  • Повторюваність на різних машинах: фіксована сітка однакова\n    щоразу, незалежно від цільового розміщення OFPS\n    вибрано, що може допомогти порівняти профілі між циклами.\n  • Діагностичні діаграми, де вам потрібен передбачуваний іменований куб\n    позиції.\n\nТипові значення при використанні: 3 – 6 (кроків на вісь). Числа\nшвидко рости — 6 кроків у RGB — це 216 патчів, 8 — 512.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Внутрішні сходи Cube (-м)
    -n:
      name: Кроки нейтральної осі
      tooltip_body: "Додає додаткові клинові плями вздовж перцепційно справжнього нейтралу\nвісь вашого принтера + папір, як визначено під час попереднього кондиціювання\nПрофіль ICC завантажується через -c.\n\nЧим він відрізняється від -g (кроки сірої осі):\n  • -g передає значення пристроїв RGB (R = G = B): 0/0/0, 32/32/32,\n    64/64/64 … Це передбачає однакові значення пристрою, що друкуються як a\n    нейтрально-сірий, який справедливий лише для ідеально лінеаризованих\n    принтер.  На реальному принтері зазвичай \"сіра рампа пристрою\".\n    має кольоровий відтінок.\n  • -n запитує наданий профіль: «які значення RGB робить ЦЕ\n    принтер насправді повинен відтворити нейтральний L*a*b*\n    (a* = b* = 0) патч на кожному кроці легкості?\"  Ті\n    (зазвичай нерівні) Значення RGB додаються як патчі.\n\nЧим він відрізняється від -N (підкреслення нейтральної осі):\n  • -N – це циферблат 0–1, який зміщує існуючий патч OFPS\n    розподіл до нейтральної області.  Це не додає\n    іменовані кроки.\n  • -n додає явні нейтральні латки, отримані з профілю\n    того, що виробляє решта розподілу.\n\nКоли його використовувати:\n  • У вас уже є ICC-профіль першого проходу для цього паперу\n    і ви створюєте діаграму уточнення.  Завантажте цей профіль\n    у розділі Профіль попереднього кондиціонування (-c), а потім встановіть для параметра -n значення 32–64\n    щільно охарактеризувати виправлену нейтральну вісь.\n  • Для першої діаграми без -c залиште значення 0 —\n    без профілю попереднього кондиціонування немає \"справжнього\"\n    нейтральна вісь для вибірки, а -g вже охоплює\n    пристрій-простір пандуса.\n\nТипові значення уточнення: 32 для рутинної роботи, 64 для\nобразотворче мистецтво / перевірка, де нейтральність є критичною.\n\nПотрібно встановити -c; інакше не впливає.\n"
      tooltip_title: Кроки нейтральної осі (-n)
    -s:
      name: Одноканальні кроки
      tooltip_body: 'Додає додаткові одноканальні патчі (R, G, B окремо).

        Корисно для характеристики індивідуальної поведінки чорнила.

        Типовий: 0 для швидкого, 20–50 для стандартного, 50–100 для високого.

        '
      tooltip_title: Кроки одного каналу (-s)
    __targen_distribution__:
      labels:
      - 'OFPS: оптимізована найдальша точка (рекомендовано)'
      - 'Інкрементна дальня точка (-t): швидше, менш рівномірно'
      - 'Навіть випадковий: простір пристрою (-r)'
      - 'Навіть випадковий: перцептивний простір (-R)'
      - 'Квазівипадкове заповнення простору: простір пристрою (-q)'
      - 'Квазівипадкове заповнення простору: перцептивний простір (-Q)'
      - 'Об’ємно-центрована кубічна решітка: простір пристрою (-i)'
      - 'Тілесно-центрована кубічна решітка: перцептивний простір (-I)'
      name: Розповсюдження патчів
      tooltip_body: 'Як targen вирішує, де розмістити кожну кольорову пляму в

        діапазон принтера. Різні алгоритми дають різні компроміси

        між покриттям, рівномірністю та швидкістю.


        Виберіть ОДИН. Вони взаємовиключні — вибираючи будь-який із них

        повністю замінює розміщення OFPS за замовчуванням.


        OFPS (за замовчуванням, рекомендовано):

        Оптимізована вибірка найдальшої точки. Ітеративно розміщує кожен новий

        латка якомога далі від усіх існуючих латок, виробляючи

        найбільш рівномірне покриття будь-якого алгоритму тут. Повільніше, ніж

        альтернативи, але золотий стандарт якості профілю. Пара

        з "Ретельною оптимізацією (-G)" для найкращих результатів.


        Додаткова дальня точка (-t):

        Простіший метод найдальшої точки. Трохи швидше, ніж OFPS

        менш навіть. Використовуйте, коли OFPS надто повільний при дуже великій кількості патчів

        і ви приймаєте невелике зниження якості.


        Random — простір пристрою (-r):

        Рівномірно випадкові фрагменти в необроблених значеннях пристрою (наприклад, RGB).

        Найшвидший із можливих, але покриття в *відчуваному* кольорі нерівномірне

        — пустує плями в областях, які наше око ледь розрізняє.


        Випадковий — перцептивний простір (-R):

        Рівномірно випадковий у сприйнятому кольорі (лабораторія). Краще, ніж -r if

        ви повинні використовувати випадкові, оскільки патчі розподіляються рівномірно

        око бачить. Все ще менш оптимальний, ніж OFPS за тієї ж кількості.


        Квазівипадкове заповнення простору (-q / -Q):

        Послідовності з низьким розходженням (подібні до Соболя), які більше заповнюють простір

        рівномірно, ніж справжній випадковий без ітераційної вартості OFPS.

        -q у просторі пристрою, -Q у просторі сприйняття. Хороша середина

        землю, коли OFPS надто повільний.


        Об''ємно-центрована кубічна решітка (-i / -I):

        Фіксована регулярна решітка (кожен патч оточений 8 сусідами

        у вигляді куба). Рішучий і дуже рівний, але негнучкий

        — точна кількість патчів, які відповідають решітці, обмежена. - я в

        пристрій простору, -я в перцептивному просторі.


        Більшість користувачів повинні залишити це на OFPS.

        '
      tooltip_title: Розповсюдження латок (-t / -r / -R / -q / -Q / -i / -I)

      name: Змінити барвник
      tooltip_body: "Змінює набір барвників, встановлений типом пристрою (-d), шляхом додавання\nабо видалення окремого барвника.  Якщо обраний барвник є\nвже присутній в наборі видаляється; якщо його немає, додається.\n\nТипове використання:\n  • Додайте помаранчевий (-D 5) до стандартного CMYK для розширення палітри\n  • Додайте світло-блакитний (-D 11) / світло-пурпуровий (-D 12) до CMYK\n    для плавніших градієнтів підсвічування\n\nУвімкніть кілька слотів для складання додаткових барвників (кожен увімкнено\nслот відкриває наступні, до 11 модифікацій).\n\nЗалиште це вимкненим для стандартних типів пристроїв 0–5.\n"
      tooltip_title: Додати/видалити барвник (-D)
    -G:
      name: Ретельна оптимізація
      tooltip_body: 'Змушує targen витрачати додатковий час на рівномірне розміщення пластирів

        можливий у всій кольоровій гамі вашого принтера. Набір латок є

        той самий тип (OFPS — оптимізована вибірка найдальшої точки,

        розподіл за замовчуванням) будь-яким способом; це просто перемикає його з

        «швидкий» режим на «хороший».


        Рекомендується ON для будь-якої діаграми, яку ви дійсно збираєтеся роздрукувати

        міра: кілька додаткових секунд комп’ютерного часу під час діаграми

        покоління дає вам помітно кращий профіль.


        Вимкніть, лише якщо ви швидко змінюєте налаштування діаграми та

        не дбають про абсолютну якість патча (наприклад, тестування друку

        макети перед створенням остаточної діаграми).


        Не має ефекту, якщо для параметра «Розповсюдження виправлень» встановлено інше значення

        ніж OFPS — альтернативні розподіли (випадкові, квазівипадкові,

        тілоцентрований куб, …) ігноруйте цей прапор.

        '
      tooltip_title: Ретельна оптимізація (-G)
    -M:
      name: Кроки поверхні куба
      tooltip_body: "Додає регулярну сітку патчів на *поверхню* принтера\nкольоровий куб — N кроків уздовж кожної грані. Патчі йдуть на\nза межами (первинні, вторинні, край гами), але не в\nінтер'єр.\n\nВстановіть 0 (за замовчуванням), щоб пропустити.\n\nКоли його використовувати:\n  • Ви конкретно хочете встановити межу гами та\n    первинні/вторинні кути без внутрішньої верхньої частини\n    з -m.\n  • Порівняння того, як різні чорнило/папір змінюють гаму\n    конверт — найбільше страждають патчі на поверхні.\n\nТипові значення при використанні: 4 – 8 кроків на обличчя.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Кроки поверхні куба (-M)
    -N:
      name: Акцент нейтральної осі
      tooltip_body: 'Контролює, наскільки сильно патчує кластер біля нейтральної осі.

        0,0 = відсутність виділення, 1,0 = максимальне скупчення поблизу сірого.

        Стандартне значення 0,5 підходить для більшості принтерів.

        '
      tooltip_title: Акцент нейтральної осі (-N)
    -V:
      name: Виділення темної області
      tooltip_body: 'Додає додаткові патчі в темних (тіньових) областях палітри.

        1.0 = без наголосу (за замовчуванням).  Збільшити до 2,0–3,0 для принтерів

        зі складною поведінкою тіні (наприклад, матовий аркуш паперу).

        '
      tooltip_title: Виділення темної області (-V)
    -b:
      name: Кроки сітки BCC
      tooltip_body: "Додає патчі на об'ємно-центрованій кубічній (BCC) решітці — щільніше\nніж звичайна кубічна сітка, оскільки вона розміщує точки на обох\nкути куба і центри куба. N - кількість\nпідрозділи вздовж кожної осі.\n\nВстановіть 0 (за замовчуванням), щоб пропустити — це ручка ніші.\n\nКоли його використовувати:\n  • Вам потрібні регулярні, вирівняні по решітці позиції патчів, але\n    з кращим упакуванням, ніж -m дає, не збираючись усе\n    шлях до ОФПС.\n  • Дослідження / сценарії повторюваності, де структура BCC\n    сама по собі суть.\n\nПримітка: це форма *лічильника кроків* (додає до вашого списку патчів);\nдля діаграми, *весь* розподіл якої є BCC, використовуйте\nСелектор «Розподіл патчів» угорі та оберіть тіло в центрі\nкубічний варіант є.\n\nПоставте прапорець, щоб увімкнути.\n"
      tooltip_title: Кубічні кроки з центром тіла (-b)
    -c:
      name: Профіль кондиціонування
      tooltip_body: 'Існуючий профіль ICC для цієї комбінації принтер/папір використано

        для попереднього обумовлення розподілу патчів у перцептивному просторі.

        Використання попереднього профілю тут створює патчі більш рівномірно

        розподіляється у вихідній гамі, що забезпечує кращу точність

        другий прохід профілювання.  Залиште поле порожнім для першого профілю.

        '
      tooltip_title: Профіль попереднього кондиціонування (-c)

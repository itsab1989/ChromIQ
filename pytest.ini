[pytest]
# Only collect the project's own tests. Without this, a bare `pytest`
# recurses from the repo root and tries to collect the ~270 third-party
# test files under .venv/ — with pytest-qt active one of them spins up a
# Qt event loop and collection appears to hang. Scoping to tests/ keeps a
# full run ~1-2s. Run with: `pytest` (or `pytest tests/`).
testpaths = tests
norecursedirs = .venv venv build dist .git assets ChromIQ
# If any single test runs longer than this, dump every thread's traceback to
# stderr (built-in faulthandler — no plugin). A WebEngine/Qt test that wedges
# then names itself instead of hanging the whole run silently. See
# scripts/run_tests.sh, which also clears orphaned QtWebEngineProcess helpers
# (left by killed runs) that can otherwise block a fresh run at startup.
faulthandler_timeout = 90
# --dist loadfile is NOT optional whenever -n is used, so it lives here rather
# than in a command that can be forgotten. 150 test files use module-scoped
# fixtures; distributing individual tests (`--dist load`) would scatter one
# module across workers and rebuild those fixtures per worker — slower, and a
# correctness hazard for any that touch shared state. loadfile keeps each file
# whole on one worker. With no -n it does nothing, so a plain `pytest` is
# unaffected.
#
# The worker count is deliberately NOT pinned here: use `-n auto`, which asks
# the machine. On a 16-core host that is 16 workers; on a smaller VM it is
# however many that VM has. Measured identical to a hand-tuned -n 12 on the
# 16-core host (gate 153s either way), so adapting costs nothing.
addopts = --dist loadfile
markers =
    slow: heavy end-to-end profile builds (minutes). Excluded from a plain
          `pytest` run; include them with `pytest --runslow` — the release
          gate ALWAYS runs the full suite with --runslow.

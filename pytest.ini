[pytest]
# Only collect the project's own tests. Without this, a bare `pytest`
# recurses from the repo root and tries to collect the ~270 third-party
# test files under .venv/ — with pytest-qt active one of them spins up a
# Qt event loop and collection appears to hang. Scoping to tests/ keeps a
# full run ~1-2s. Run with: `pytest` (or `pytest tests/`).
testpaths = tests
norecursedirs = .venv venv build dist .git assets ChromIQ
# If any single test runs longer than this, dump every thread's traceback to
# stderr (built-in faulthandler — no plugin). A WebEngine/Qt test that wedges
# then names itself instead of hanging the whole run silently. See
# scripts/run_tests.sh, which also clears orphaned QtWebEngineProcess helpers
# (left by killed runs) that can otherwise block a fresh run at startup.
#
# THREE HUNDRED, NOT NINETY, AND THE NUMBER IS THE WHOLE POINT.
# Measured 2026-09-02 on a full `--runslow -n auto` gate (`--durations=40`):
# the slowest single test in the suite is
# `test_engine_v2_options.py::test_spectral_physics_flag_runs_challenge` at
# 83.34 s, and the next is 50.63 s. Ninety gave the slowest test SEVEN SECONDS
# of headroom, so on any loaded machine this fired — on a test that was merely
# slow. It fired in 7 of the 20 gate logs on disk.
#
# What it prints when it fires is a full multi-thread traceback opening with
# `Thread 0x... (most recent call first):` — the same first line as a real
# `Fatal Python error: Segmentation fault` dump. A reviewer read one of those,
# in a GREEN run, as proof that the gate was segfaulting silently, and that
# reading cost an hour. A watchdog that cries wolf on ordinary slow tests
# teaches people to skip past tracebacks, which is exactly how a real crash
# gets normalised.
#
# 300 s is 3.6x the slowest measured test and still names a genuine hang inside
# five minutes, against a whole gate of about 3:20. A crash is reported
# separately and unmistakably — see the crash banner in tests/conftest.py, which
# also fails the run.
faulthandler_timeout = 300
# --dist loadfile is NOT optional whenever -n is used, so it lives here rather
# than in a command that can be forgotten. 150 test files use module-scoped
# fixtures; distributing individual tests (`--dist load`) would scatter one
# module across workers and rebuild those fixtures per worker — slower, and a
# correctness hazard for any that touch shared state. loadfile keeps each file
# whole on one worker. With no -n it does nothing, so a plain `pytest` is
# unaffected.
#
# The worker count is deliberately NOT pinned here: use `-n auto`, which asks
# the machine. On a smaller VM that is however many cores it has; on this
# 16-core Mac it would be 16, and --maxprocesses holds it to 12.
#
# WHY 12 AND NOT 16. The host has 12 PERFORMANCE cores and 4 efficiency ones,
# and past 12 workers xdist starts scheduling onto the slow ones. Measured on
# the full gate, 2026-08-24: n=12 2:57, n=14 2:56, n=16 2:59, n=20 3:00 — a
# plateau, because `--dist loadfile` cannot beat its slowest single file
# (tests/test_engine_v2_options.py, 157s on one worker). 12 is the cheapest
# point on that plateau and keeps every worker on a fast core.
#
# --maxprocesses is a CEILING, not a pin: `min(numprocesses, maxprocesses)`.
# On a VM with fewer cores `-n auto` still wins, so the same command is right
# on every host. It does nothing at all without -n, so a single-file
# `pytest tests/test_x.py` stays serial and instant.
# --max-worker-restart=0 — A DEAD WORKER MUST END THE RUN, NOT RESTART IT.
# Without it xdist replaces a crashed worker and carries on. Two things follow,
# and the second is why this is here rather than in a command:
#
#   * the replacement is handed the SAME item the dead one was holding, so a
#     reproducible crash is re-run once per restart until the default cap
#     (4 x the worker count) is reached. Measured here on 2026-09-03 with a
#     deliberate null-pointer dereference in a test: NINE crashed workers and
#     nine identical FAILED lines for one bug.
#   * spawning that replacement can itself fail, and then the controller waits
#     for a node that will never report. That is what happened on the owner's
#     Windows ARM64 VM on 2026-09-03: `w7_gate_A_hung_utf8.log` shows
#     `[gw1] node down` at 99 %, then `replacing crashed worker`, then
#     `OSError: [Errno 22] Invalid argument` out of execnet's bootstrap — and
#     the session never terminated. Neither of two `--runslow` attempts ever
#     printed a summary line or returned an exit code.
#
# The crash banner in tests/conftest.py cannot help with that, because it runs
# in `pytest_terminal_summary` — i.e. only if the session ends. A gate that
# hangs for ever is worse than one that fails.
#
# With the flag, xdist prints "Maximum crashed workers reached" and shuts the
# session down, the banner fires, and the run exits non-zero. Proved both ways
# on 2026-09-03: without it, 9 restarts / 51 s / exit 1; with it, 1 failure /
# no restart / exit 1.
addopts = --dist loadfile --maxprocesses=12 --max-worker-restart=0
markers =
    slow: heavy end-to-end profile builds (minutes). Excluded from a plain
          `pytest` run; include them with `pytest --runslow` — the release
          gate ALWAYS runs the full suite with --runslow.

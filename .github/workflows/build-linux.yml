name: Build Linux App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v3.5.0-beta.1)'
        required: true
      # A CI check, not a release: build the dispatched branch's own commit
      # and publish nothing (no release created, no asset uploaded). `tag`
      # then only names the files. Off by default, and absent on a tag push,
      # so a real release build behaves exactly as before.
      dry_run:
        description: 'Dry run: build the dispatched branch, create no release, upload nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: ChromIQ-Linux-x86_64.tar.gz
            runner: ubuntu-latest

          - arch: aarch64
            artifact: ChromIQ-Linux-aarch64.tar.gz
            runner: ubuntu-24.04-arm

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.ref_name }}
          fetch-depth: 0  # need full history + tags for the release-notes fallback

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # libcups2-dev is required to build the pycups extension.
      # The remaining libs are Qt platform-plugin runtime deps so the
      # bundled app can launch under headless smoke tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcups2-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            cmake \
            build-essential

      # Bit-exact gamut-mapping helper — ArgyllCMS's real gamut mapper compiled
      # from the vendored subset (native/argyll) with the system gcc. Native on
      # both the x86_64 and aarch64 runners. ChromIQLinux.spec bundles
      # native/chromiq-gammap when present.
      - name: Build bit-exact gamut helper
        run: |
          set -euo pipefail
          cmake -S native/gammap_helper -B build/gammap -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gammap -j"$(nproc)"
          cp build/gammap/chromiq-gammap native/chromiq-gammap
          file native/chromiq-gammap

      - name: Build chart-reading engine
        run: |
          set -euo pipefail
          cmake -S native/chartread_helper -B build/chartread -DCMAKE_BUILD_TYPE=Release
          cmake --build build/chartread -j"$(nproc)"
          cp build/chartread/chromiq-chartread native/chromiq-chartread
          file native/chromiq-chartread

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Generate app icons (optional on Linux but verifies the script)
        run: python scripts/build_icons.py

      - name: Build Linux executable
        run: python -m PyInstaller ChromIQLinux.spec

      - name: Inspect built binary
        run: |
          # Don't try to launch the GUI — there's no DISPLAY on the runner,
          # and the binary has no --help to trigger an early exit, so
          # actually executing it would hang the job indefinitely
          # (especially on the aarch64 runner).  Just verify the bootloader
          # exists, is executable, and has the right ELF architecture.
          file dist/ChromIQ/ChromIQ
          test -x dist/ChromIQ/ChromIQ
          ls -lh dist/ChromIQ/ChromIQ

      - name: Package as tar.gz
        run: |
          tar -C dist -czf "${{ matrix.artifact }}" ChromIQ
          ls -lh "${{ matrix.artifact }}"

      - name: Dry run, nothing published
        if: ${{ inputs.dry_run }}
        run: ls -lh "${{ matrix.artifact }}"

      - name: Create GitHub Release (if not exists)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          # Mark pre-release-style tags (-alpha/-beta/-rc/-pre) as
          # GitHub prereleases; final tags (e.g. v3.5.0) stay regular.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            body=$(awk "/^## ${TAG}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
            if [ -z "$body" ]; then
              # No CHANGELOG.md entry for this tag — fall back to commit subjects
              # since the previous tag so release notes are never empty.
              PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
              if [ -n "$PREV_TAG" ]; then
                COMMITS=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}")
                body=$(printf '### Changes since %s\n%s' "$PREV_TAG" "$COMMITS")
              else
                COMMITS=$(git log --pretty=format:'- %s' "$TAG")
                body=$(printf '### Changes\n%s' "$COMMITS")
              fi
            fi
            {
              printf '%s\n\n---\n' "$body"
              printf '**Installation (Linux, beta):** Download the tarball for your architecture '
              printf '(x86_64 for most desktops/laptops, aarch64 for ARM systems like Raspberry Pi 4/5). '
              printf 'Extract with `tar xzf ChromIQ-Linux-*.tar.gz`, then run `./ChromIQ/ChromIQ`. '
              printf 'Requires ArgyllCMS — install via your package manager (`sudo apt install argyll`) '
              printf 'or from argyllcms.com/downloadlinux.html.'
              printf '\n\n---\n☕ ChromIQ is free and always will be — if it saves you time or ink, a coffee is a kind way to say thanks. Completely optional, and the app stays fully featured either way.\n\n'
              printf '[![Support ChromIQ on Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/itsab1989)\n'
            } > /tmp/release_notes.txt
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes-file /tmp/release_notes.txt \
              $PRERELEASE_FLAG 2>/dev/null || true
          fi

      - name: Upload tarball to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version-stamp the asset filename
          # (ChromIQ-Linux-x86_64_v3.9.29.tar.gz) so downloads don't collide and
          # each file is self-identifying. The download-stats dashboard
          # classifies by the platform/arch tokens, which the suffix leaves
          # intact.
          ART="${{ matrix.artifact }}"
          VERSIONED="${ART%.tar.gz}_${RELEASE_TAG}.tar.gz"
          mv "$ART" "$VERSIONED"
          gh release upload "$RELEASE_TAG" "$VERSIONED" --clobber

name: Build macOS App Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact: ChromIQ-macOS-arm64.dmg
            target_arch_env: ''

          - arch: universal2
            artifact: ChromIQ-macOS-universal.dmg
            target_arch_env: 'universal2'

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0  # need full history + tags for the release-notes fallback

      # arm64 job: GitHub-hosted Python 3.13 (stable, arm64)
      - name: Set up Python (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # universal2 job: python.org official universal2 installer so that pip
      # fetches universal2 wheels for all packages, giving fat binaries that
      # PyInstaller can bundle into a single universal2 app.
      - name: Set up Python (universal2 via python.org installer)
        if: matrix.arch == 'universal2'
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.13.3/python-3.13.3-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.13/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller
          # numpy ≥2.4 dropped the in-wheel OpenBLAS and now expects the
          # externally-vendored scipy-openblas64 package to be present at
          # runtime, but it is *not* declared as a hard dep on PyPI — pip
          # won't pull it via `pip install numpy`. Without it,
          # _multiarray_umath.so dlopens libscipy_openblas64_.dylib at
          # `import numpy` time and crashes the app before any code runs.
          # Install explicitly so collect_dynamic_libs('scipy_openblas64')
          # in ChromIQ.spec can bundle the dylib. See issue #11.
          pip3 install scipy-openblas64

      # pycups has no macOS wheel; build from source as a fat binary.
      - name: Force universal2 fat binaries (universal2 only)
        if: matrix.arch == 'universal2'
        run: |
          ARCHFLAGS="-arch x86_64 -arch arm64" pip3 install --force-reinstall --no-binary pycups pycups

      # imagecodecs dropped x86_64 wheels in 2026; pin to last version that still has one.
      - name: Pin imagecodecs to last x86_64-compatible version (universal2 only)
        if: matrix.arch == 'universal2'
        run: pip3 install --quiet 'imagecodecs==2025.11.11'

      # Diagnostic: numpy 2.4+ vendored OpenBLAS lives in different places
      # depending on platform/version (numpy/.dylibs/, numpy.libs/ sibling, or
      # an external scipy_openblas64 package). Print where it actually is so
      # spec changes can target the right path. Cheap and self-documenting.
      - name: Locate OpenBLAS in install
        run: |
          set +e
          SITELIB=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "Site-packages: $SITELIB"
          echo "--- pip packages matching openblas/numpy ---"
          pip3 list 2>/dev/null | grep -iE 'openblas|numpy' || true
          echo "--- libscipy_openblas / libopenblas anywhere in site-packages ---"
          find "$SITELIB" \( -name 'libscipy_openblas*.dylib' -o -name 'libopenblas*.dylib' \) 2>/dev/null || true
          echo "--- numpy dir top-level ---"
          ls -la "$SITELIB/numpy" 2>/dev/null | head -30 || true
          echo "--- numpy/.dylibs/ ---"
          ls -la "$SITELIB/numpy/.dylibs" 2>/dev/null || echo "(no numpy/.dylibs)"
          echo "--- numpy.libs sibling ---"
          ls -la "$SITELIB/numpy.libs" 2>/dev/null || echo "(no numpy.libs)"
          echo "--- scipy_openblas* / scipy-openblas* ---"
          ls -la "$SITELIB" 2>/dev/null | grep -i openblas || echo "(no openblas package)"

      # numpy, Pillow, PyYAML, imagecodecs, PyQt6-Qt6 and PyQt6-WebEngine-Qt6 ship
      # only arch-specific wheels — no universal2 exists on PyPI for any of them.
      # Strategy: query PyPI JSON API for each package's x86_64 wheel, download it,
      # and lipo-merge every Mach-O binary with the arm64 file already installed
      # by pip, matching by relative path inside the wheel/site-packages tree.
      # We match Mach-O files (not just *.so / *.dylib) because PyQt6-Qt6 ships
      # framework binaries with no extension at e.g.
      # PyQt6/Qt6/lib/QtGui.framework/Versions/A/QtGui — the original extension
      # filter missed those, leaving the universal2 DMG arm64-only for Qt itself.
      # lipo_pkg args: <PyPI name> <site-packages dir> <version tag filter>
      #   ver_filter must appear in the wheel filename to select the right Python
      #   version. Use "cp313" for cpython-tagged wheels, "abi3" for stable-ABI
      #   wheels, "py3-none" for pure-tag arch-specific wheels (PyQt6-Qt6 etc).
      - name: Make C extensions universal2 via lipo (universal2 only)
        if: matrix.arch == 'universal2'
        run: |
          SITELIB=$(python3 -c "import site; print(site.getsitepackages()[0])")
          lipo_pkg() {
            local pypi_name="$1" pkg_dir="$2" ver_filter="$3"
            local VER X86_URL TMPDIR safe x86_root arm_root rel arm_file merged=0
            VER=$(python3 -c "import importlib.metadata; print(importlib.metadata.version('${pypi_name}'))")
            X86_URL=$(curl -fsSL "https://pypi.org/pypi/${pypi_name}/${VER}/json" | \
              python3 -c "import json,sys; vf='${ver_filter}'; d=json.load(sys.stdin); w=[f['url'] for f in d['urls'] if 'macosx' in f['filename'] and 'x86_64' in f['filename'] and vf in f['filename'] and f['filename'].endswith('.whl')]; print(w[0] if w else '')")
            if [ -z "$X86_URL" ]; then
              echo "No x86_64 wheel for ${pypi_name} ${VER} — skipping lipo"
              return 0
            fi
            echo "Downloading x86_64 wheel for ${pypi_name} ${VER}: $X86_URL"
            safe="${pkg_dir//\//_}"
            TMPDIR="/tmp/${safe}_x86"
            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"
            curl -fsSL -o "/tmp/${safe}.whl" "$X86_URL"
            unzip -q "/tmp/${safe}.whl" -d "$TMPDIR"
            x86_root="$TMPDIR/${pkg_dir}"
            arm_root="${SITELIB}/${pkg_dir}"
            if [ ! -d "$x86_root" ]; then
              echo "ERROR: ${pkg_dir} not found in x86_64 wheel for ${pypi_name}"
              return 1
            fi
            while IFS= read -r x86_file; do
              [ -f "$x86_file" ] || continue
              case "$(file -b "$x86_file" 2>/dev/null)" in
                Mach-O*) ;;
                *) continue ;;
              esac
              rel="${x86_file#$x86_root/}"
              arm_file="$arm_root/$rel"
              if [ -f "$arm_file" ] && lipo -create "$arm_file" "$x86_file" -output "$arm_file" 2>/dev/null; then
                merged=$((merged + 1))
              fi
            done < <(find "$x86_root" -type f)
            echo "Merged $merged Mach-O binaries for ${pypi_name}"
          }
          lipo_pkg numpy                numpy             cp313
          lipo_pkg Pillow               PIL               cp313
          lipo_pkg PyYAML               yaml              cp313
          lipo_pkg imagecodecs          imagecodecs       abi3
          lipo_pkg PyQt6-Qt6            PyQt6/Qt6         py3-none
          lipo_pkg PyQt6-WebEngine-Qt6  PyQt6/Qt6         py3-none
          # scipy-openblas64 ships a single dylib per arch in a py3-none wheel;
          # required by numpy ≥2.4 (see Install step). Lipo so the universal2
          # bundle has a fat libscipy_openblas64_.dylib.
          lipo_pkg scipy-openblas64     scipy_openblas64  py3-none

      # Bit-exact gamut-mapping helper — ArgyllCMS's real gamut mapper compiled
      # from the vendored subset (native/argyll). Built universal2 so it passes
      # the fat-Mach-O check below and runs on both Intel and Apple Silicon.
      # PyInstaller (ChromIQ.spec) bundles native/chromiq-gammap when present.
      - name: Build bit-exact gamut helper (universal2)
        run: |
          set -euo pipefail
          cmake -S native/gammap_helper -B build/gammap \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build/gammap -j3
          cp build/gammap/chromiq-gammap native/chromiq-gammap
          echo "helper archs: $(lipo -archs native/chromiq-gammap)"

      # Chart-reading engine — the chromiq-chartread fork of ArgyllCMS
      # chartread (native/chartread_helper + vendored native/instlib). Same
      # universal2 discipline; ChromIQ.spec bundles native/chromiq-chartread
      # when present, and the engine falls back to stock chartread otherwise.
      - name: Build chart-reading engine (universal2)
        run: |
          set -euo pipefail
          cmake -S native/chartread_helper -B build/chartread \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build/chartread -j3
          cp build/chartread/chromiq-chartread native/chromiq-chartread
          echo "engine archs: $(lipo -archs native/chromiq-chartread)"

      - name: Build app bundle
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.target_arch_env }}
        run: python3 -m PyInstaller ChromIQ.spec

      # Safety net for Intel-Mac regressions: walk every Mach-O file in the bundle
      # and assert it contains both x86_64 and arm64 slices. Catches anything the
      # lipo merge step missed (e.g. a new dependency that ships arch-specific wheels
      # without us noticing). Failed checks abort the build before we ship a broken
      # "universal" DMG to users — see issue #11 (v3.2.5) for the precedent.
      - name: Verify universal2 bundle (every Mach-O must be fat)
        if: matrix.arch == 'universal2'
        run: |
          set -euo pipefail
          fail=0
          checked=0
          while IFS= read -r b; do
            [ -f "$b" ] || continue
            case "$(file -b "$b" 2>/dev/null)" in
              Mach-O*) ;;
              *) continue ;;
            esac
            checked=$((checked + 1))
            archs=$(lipo -archs "$b" 2>/dev/null || echo "")
            if [[ "$archs" != *"x86_64"* || "$archs" != *"arm64"* ]]; then
              echo "::error file=$b::Not universal2: archs=[$archs]"
              fail=1
            fi
          done < <(find dist/ChromIQ.app -type f)
          echo "Checked $checked Mach-O binaries"
          if [ "$fail" -ne 0 ]; then
            echo "Universal2 verification FAILED — bundle would be broken on Intel Macs"
            exit 1
          fi
          echo "All $checked Mach-O binaries are universal2"

      # numpy ≥2.4 references libscipy_openblas64_.dylib via @rpath; if
      # PyInstaller's hook fails to bundle it the app crashes at import time
      # with a dlopen error before any GUI code runs (issue #11, v3.2.7).
      # The bundled hook missed it on universal2 builds — assert the dylib
      # exists so a hook regression never silently ships again.
      - name: Verify numpy OpenBLAS is bundled
        run: |
          set -euo pipefail
          found=$(find dist/ChromIQ.app/Contents/Frameworks \
            \( -name 'libscipy_openblas*.dylib' -o -name 'libopenblas*.dylib' \) \
            2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "::error::numpy OpenBLAS dylib missing from Contents/Frameworks/ — app would crash on numpy import"
            find dist/ChromIQ.app -name '*.dylib' | head -40
            exit 1
          fi
          echo "Found numpy OpenBLAS: $found"
          archs=$(lipo -archs "$found" 2>/dev/null || echo "")
          echo "Architectures: $archs"

      - name: Codesign app (ad-hoc)
        run: |
          # Sign bottom-up: leaf binaries first, then frameworks, then the app.
          # Avoid --deep: it re-signs internals after we've already signed them,
          # which can corrupt the code directory on Apple Silicon.
          find dist/ChromIQ.app -type f \( -name "*.so" -o -name "*.dylib" \) \
            -exec codesign --force --sign - {} \;
          find dist/ChromIQ.app -name "*.framework" -type d \
            -exec codesign --force --sign - {} \;
          find dist/ChromIQ.app -name "*.bundle" -type d \
            -exec codesign --force --sign - {} \;
          codesign --force --sign - dist/ChromIQ.app

      - name: Verify app signature
        run: codesign --verify --verbose dist/ChromIQ.app

      - name: Create DMG
        run: |
          # Two-step approach — avoids hdiutil create -srcfolder hanging on
          # GitHub Actions runners when bundling large app bundles.
          APP_MB=$(du -sm dist/ChromIQ.app | awk '{print $1}')
          # HFS+ overhead + safety headroom. 40 MB was tight before
          # scipy-openblas64 was added; 200 MB leaves room for future deps
          # without filling the writable image (compressed UDZO output is
          # unaffected — empty space gets squeezed out at convert time).
          IMG_MB=$((APP_MB + 200))

          # Step 1: writable sparse image
          hdiutil create -megabytes "$IMG_MB" \
            -volname "ChromIQ" -fs HFS+ /tmp/rw.dmg

          # Step 2: mount it
          MOUNT=$(hdiutil attach /tmp/rw.dmg -nobrowse -noautoopen \
            | awk '/Apple_HFS/{print $NF}')

          # Step 3: populate
          ditto dist/ChromIQ.app "$MOUNT/ChromIQ.app"
          ln -sf /Applications "$MOUNT/Applications"
          sync

          # Step 4: detach. A force-detach often ejects the volume while still
          # returning a non-zero "Resource busy" status, after which retries hit
          # "No such file or directory". So also treat an already-unmounted
          # volume as success, otherwise the loop burns all attempts on a volume
          # that's actually gone and convert then races the still-settling device.
          for i in 1 2 3 4 5 6; do
            if hdiutil detach "$MOUNT" -force 2>/dev/null; then
              break
            fi
            if ! hdiutil info | grep -q "$MOUNT"; then
              echo "volume already detached"
              break
            fi
            echo "detach attempt $i failed (volume busy); retrying in 3s…"
            sleep 3
          done

          # Wait for diskimages-helper to release the image file — convert
          # needs exclusive access and EAGAINs while the helper lingers
          # (beta.136 burned all retries in 15 s against a busy handle).
          for i in $(seq 1 10); do
            hdiutil info | grep -q "/tmp/rw.dmg" || break
            echo "image still referenced; waiting… ($i)"
            sleep 3
          done

          # Step 5: convert to compressed read-only (UDZO = zlib) — from a
          # fresh COPY of the image: the copy has its own inode, so a stale
          # exclusive claim on the original can't EAGAIN the convert. Keep
          # retrying with growing backoff for the copy-also-raced case.
          for wait in 5 10 20 40; do
            rm -f "${{ matrix.artifact }}" /tmp/rw-copy.dmg
            cp /tmp/rw.dmg /tmp/rw-copy.dmg
            if hdiutil convert /tmp/rw-copy.dmg \
                 -format UDZO -imagekey zlib-level=9 \
                 -o "${{ matrix.artifact }}"; then
              break
            fi
            echo "convert attempt failed; retrying in ${wait}s…"
            sleep "$wait"
          done
          [ -f "${{ matrix.artifact }}" ] || { echo "DMG convert failed"; exit 1; }

          rm -f /tmp/rw.dmg /tmp/rw-copy.dmg

      - name: Codesign DMG (ad-hoc)
        run: codesign --sign - "${{ matrix.artifact }}"

      # Derive an Intel-only DMG from the universal2 build by stripping arm64
      # slices from every Mach-O. Same source app, ~half the binary size — useful
      # for users who know they're on Intel and want a smaller download.
      - name: Derive x86_64-only app from universal2 bundle
        if: matrix.arch == 'universal2'
        run: |
          set -euo pipefail
          THIN_APP=dist/ChromIQ-x86_64.app
          rm -rf "$THIN_APP"
          ditto dist/ChromIQ.app "$THIN_APP"
          thinned=0
          skipped_bootloader=0
          while IFS= read -r b; do
            [ -f "$b" ] || continue
            case "$(file -b "$b" 2>/dev/null)" in
              Mach-O*) ;;
              *) continue ;;
            esac
            # PyInstaller's bootloader at Contents/MacOS/ChromIQ has its onedir
            # PKG archive appended *after* the Mach-O slices. `lipo -thin` writes
            # only the Mach-O bytes and silently discards the trailing archive,
            # which bricks the binary at runtime with PYI-3463 ("Could not load
            # PyInstaller's embedded PKG archive"). Leave it as-is — universal2
            # bootloader is small (~1 MB) and macOS Intel picks the x86_64 slice
            # at exec time. See issue #11 for the v3.2.7 regression precedent.
            if [[ "$b" == */Contents/MacOS/ChromIQ ]]; then
              echo "Skipping PyInstaller bootloader (preserves appended PKG archive): $b"
              skipped_bootloader=$((skipped_bootloader + 1))
              continue
            fi
            archs=$(lipo -archs "$b" 2>/dev/null || echo "")
            if [[ "$archs" != *"x86_64"* ]]; then
              echo "::error file=$b::No x86_64 slice in universal app: archs=[$archs]"
              exit 1
            fi
            if [[ "$archs" == *"arm64"* ]]; then
              tmp=$(mktemp)
              lipo -thin x86_64 "$b" -output "$tmp"
              mv "$tmp" "$b"
              thinned=$((thinned + 1))
            fi
          done < <(find "$THIN_APP" -type f)
          echo "Stripped arm64 from $thinned binaries; skipped $skipped_bootloader bootloader(s)"

      - name: Verify x86_64 app contains no arm64 slices
        if: matrix.arch == 'universal2'
        run: |
          set -euo pipefail
          THIN_APP=dist/ChromIQ-x86_64.app
          fail=0
          while IFS= read -r b; do
            [ -f "$b" ] || continue
            case "$(file -b "$b" 2>/dev/null)" in
              Mach-O*) ;;
              *) continue ;;
            esac
            # Bootloader is intentionally left universal2 (see derive step);
            # macOS picks the x86_64 slice at exec time.
            if [[ "$b" == */Contents/MacOS/ChromIQ ]]; then
              continue
            fi
            archs=$(lipo -archs "$b" 2>/dev/null || echo "")
            if [[ "$archs" == *"arm64"* ]]; then
              echo "::error file=$b::arm64 slice still present after thin: archs=[$archs]"
              fail=1
            fi
          done < <(find "$THIN_APP" -type f)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "x86_64 bundle is clean of arm64 slices (bootloader exempted)"

      - name: Codesign x86_64 app (ad-hoc)
        if: matrix.arch == 'universal2'
        run: |
          # Modifying binaries invalidates the universal app's signatures —
          # re-sign bottom-up using the same pattern as the parent app.
          THIN_APP=dist/ChromIQ-x86_64.app
          find "$THIN_APP" -type f \( -name "*.so" -o -name "*.dylib" \) \
            -exec codesign --force --sign - {} \;
          find "$THIN_APP" -name "*.framework" -type d \
            -exec codesign --force --sign - {} \;
          find "$THIN_APP" -name "*.bundle" -type d \
            -exec codesign --force --sign - {} \;
          codesign --force --sign - "$THIN_APP"
          codesign --verify --verbose "$THIN_APP"

      - name: Create x86_64 DMG
        if: matrix.arch == 'universal2'
        run: |
          THIN_APP=dist/ChromIQ-x86_64.app
          X86_DMG=ChromIQ-macOS-x86_64.dmg
          APP_MB=$(du -sm "$THIN_APP" | awk '{print $1}')
          IMG_MB=$((APP_MB + 40))
          hdiutil create -megabytes "$IMG_MB" \
            -volname "ChromIQ" -fs HFS+ /tmp/rw_x86.dmg
          MOUNT=$(hdiutil attach /tmp/rw_x86.dmg -nobrowse -noautoopen \
            | awk '/Apple_HFS/{print $NF}')
          ditto "$THIN_APP" "$MOUNT/ChromIQ.app"
          ln -sf /Applications "$MOUNT/Applications"
          sync
          # Same detach-then-convert race guard as the universal DMG above.
          for i in 1 2 3 4 5 6; do
            hdiutil detach "$MOUNT" -force 2>/dev/null && break
            hdiutil info | grep -q "$MOUNT" || { echo "already detached"; break; }
            echo "detach attempt $i failed; retrying in 3s…"; sleep 3
          done
          sleep 2
          # Retry convert — the device can still report "Resource temporarily
          # unavailable" right after detach on the runner (same guard as the
          # universal DMG above; this bare convert flaked on v3.13.0-beta.2).
          for i in 1 2 3; do
            rm -f "$X86_DMG"
            if hdiutil convert /tmp/rw_x86.dmg \
                 -format UDZO -imagekey zlib-level=9 \
                 -o "$X86_DMG"; then
              break
            fi
            echo "x86_64 convert attempt $i failed; retrying in 5s…"
            sleep 5
          done
          [ -f "$X86_DMG" ] || { echo "x86_64 DMG convert failed"; exit 1; }
          rm -f /tmp/rw_x86.dmg
          codesign --sign - "$X86_DMG"

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          # Mark pre-release-style tags (-alpha/-beta/-rc/-pre) as
          # GitHub prereleases; final tags (e.g. v3.5.0) stay regular.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Knut, beta.139: *"the release note must give a great overview of
            # all added features, and the list of bugfixes must be shown in a
            # comprehensive manner so that users can recognise if a bug they
            # have been annoyed by has been fixed."* scripts/release_notes.py
            # groups the entry into What's new / Changed / Fixed and puts a
            # one-line summary on top. The old awk extraction stays as the
            # fallback, so a note is never empty.
            body=$(python3 scripts/release_notes.py --tag "$TAG" 2>/dev/null || true)
            if [ -z "$body" ]; then
              body=$(awk "/^## ${TAG}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
            fi
            if [ -z "$body" ]; then
              # No CHANGELOG.md entry for this tag — fall back to commit subjects
              # since the previous tag so release notes are never empty.
              PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
              if [ -n "$PREV_TAG" ]; then
                COMMITS=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}")
                body=$(printf '### Changes since %s\n%s' "$PREV_TAG" "$COMMITS")
              else
                COMMITS=$(git log --pretty=format:'- %s' "$TAG")
                body=$(printf '### Changes\n%s' "$COMMITS")
              fi
            fi
            {
              printf '%s\n\n---\n' "$body"
              printf '**Installation:** Open the DMG, drag ChromIQ to Applications, eject, then launch.\n\n'
              printf 'ChromIQ is ad-hoc signed (not notarized). On macOS Sonoma+ the right-click → Open trick often fails with *"Apple cannot check it for malicious software."* If that happens, remove the quarantine flag in Terminal:\n\n'
              printf '```\nxattr -dr com.apple.quarantine /Applications/ChromIQ.app\n```\n\n'
              printf 'Then double-click as normal.\n\n'
              printf 'Requires macOS 13+ (Ventura) and ArgyllCMS 3.5.0 at `/Applications/Argyll/bin`.'
              printf '\n\n---\n☕ ChromIQ is free and always will be — if it saves you time or ink, a coffee is a kind way to say thanks. Completely optional, and the app stays fully featured either way.\n\n'
              printf '[![Support ChromIQ on Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/itsab1989)\n'
            } > /tmp/release_notes.txt
            # The arm64 and universal2 matrix legs run in parallel and both
            # pass the `gh release view` check above when neither has created
            # the release yet — a classic TOCTOU. Catch the 422 "already exists"
            # from the loser of the race and treat it as success so its DMG
            # upload step still runs. See v3.5.0 run 25916850655 for the
            # incident this guards against.
            if ! gh release create "$TAG" \
                   --title "ChromIQ $TAG" \
                   --notes-file /tmp/release_notes.txt \
                   $PRERELEASE_FLAG 2>/tmp/create_err; then
              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "Release was created concurrently by the parallel build — continuing."
                cat /tmp/create_err || true
              else
                cat /tmp/create_err >&2
                exit 1
              fi
            fi
          fi

      - name: Upload DMG(s) to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version-stamp the asset filename (ChromIQ-macOS-arm64_v3.9.29.dmg)
          # so downloads don't collide as "...(1).dmg" and each file is
          # self-identifying. The download-stats dashboard classifies by the
          # platform/arch tokens, which the suffix leaves intact.
          ART="${{ matrix.artifact }}"
          VERSIONED="${ART%.dmg}_${RELEASE_TAG}.dmg"
          mv "$ART" "$VERSIONED"
          gh release upload "$RELEASE_TAG" "$VERSIONED" --clobber
          # universal2 job also publishes the x86_64-thinned DMG.
          if [ "${{ matrix.arch }}" = "universal2" ] && [ -f "ChromIQ-macOS-x86_64.dmg" ]; then
            X86_VERSIONED="ChromIQ-macOS-x86_64_${RELEASE_TAG}.dmg"
            mv "ChromIQ-macOS-x86_64.dmg" "$X86_VERSIONED"
            gh release upload "$RELEASE_TAG" "$X86_VERSIONED" --clobber
          fi

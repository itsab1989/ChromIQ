name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v3.0.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: ChromIQ-Windows-x64.zip
            runner: windows-latest
            python_arch: x64

          - arch: arm64
            artifact: ChromIQ-Windows-arm64.zip
            runner: windows-11-arm
            python_arch: arm64

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0  # need full history + tags for the release-notes fallback

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}

      # pycups is macOS/Linux-only; filter it out before installing.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v 'pycups' requirements.txt > requirements-win.txt
          pip install -r requirements-win.txt -r requirements-build.txt

      # Generate a .ico from the existing app_icon.png using Pillow (already installed).
      - name: Generate Windows icon
        shell: python
        run: |
          from PIL import Image
          img = Image.open('assets/app_icon.png').convert('RGBA')
          img.save(
              'assets/app_icon.ico',
              format='ICO',
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          print('Generated assets/app_icon.ico')

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Build wdi-simple from libwdi source. Only x64 is needed — x64 binaries run on
      # ARM64 Windows via the built-in x64 emulation layer.
      - name: Build wdi-simple from source
        shell: cmd
        run: |
          git clone --depth=1 https://github.com/pbatard/libwdi.git libwdi-src

          REM libwdi pins PlatformToolset=v143 (VS2022). The windows-latest image
          REM moved to VS18 and dropped the v143 ARM64 component, so the solution's
          REM installer_arm64.vcxproj fails with MSB8020. Retarget every project to
          REM the runner's default toolset instead: v143 on windows-11-arm (VS2022,
          REM unchanged), the current one on whatever VS the x64 image ships.
          powershell -Command "Get-ChildItem -Recurse libwdi-src -Filter *.vcxproj | ForEach-Object { (Get-Content $_.FullName) -replace '<PlatformToolset>v\d+</PlatformToolset>', '<PlatformToolset>$(DefaultPlatformToolset)</PlatformToolset>' | Set-Content $_.FullName }"

          REM All prerequisites go inside libwdi-src\ — embedder resolves paths from libwdi-src\libwdi\
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o wdk-redist.msi "https://go.microsoft.com/fwlink/p/?LinkID=253170"
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\libwdi-src\wdk

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o libusb0.zip "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip"
          7z x libusb0.zip -o"libwdi-src"

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o libusbk.7z "https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z"
          7z x libusbk.7z -o"libwdi-src"

          cd libwdi-src
          ren libusb-win32-bin-1.4.0.0 libusb0
          ren libusbK-3.1.0.0-bin libusbk
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=x64,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\";LIBUSB0_DIR=\"../libusb0\";LIBUSBK_DIR=\"../libusbk/bin\""

          copy x64\Release\examples\wdi-simple.exe ..\assets\wdi_simple.exe
          dir ..\assets\wdi_simple.exe

      # zadig.exe is bundled as the fallback if wdi-simple fails or is cancelled.
      - name: Download Zadig (fallback USB driver installer)
        shell: bash
        run: |
          # --retry-all-errors so a transient HTTP 503 from the download CDN is
          # retried instead of failing the whole build (it flaked a beta once).
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/zadig.exe \
            "https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe"

      # Bit-exact gamut-mapping helper — ArgyllCMS's real gamut mapper compiled
      # from the vendored subset (native/argyll) with mingw-w64 gcc, statically
      # linked so the .exe needs no runtime DLLs (verified via objdump on a local
      # cross-build). x64 only: on Windows-arm64 the app falls back to the fast
      # Python mapper, and ChromIQWin.spec bundles the helper only when present.
      - name: Build bit-exact gamut helper (x64, mingw-w64)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          choco install mingw ninja -y --no-progress
          # CMake is preinstalled on windows-latest, but install it if a future
          # image drops it so the build fails loudly on choco, not on a bare cmake.
          command -v cmake >/dev/null 2>&1 || {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            export PATH="/c/Program Files/CMake/bin:$PATH"; }
          gcc --version
          cmake -S native/gammap_helper -B build/gammap -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build/gammap
          cp build/gammap/chromiq-gammap.exe native/chromiq-gammap.exe
          echo "helper deps:"; objdump -p native/chromiq-gammap.exe | grep -i "DLL Name" || true

      # Chart-reading engine (x64) — chromiq-chartread, same mingw-w64 toolchain.
      # Links the vendored Argyll instrument library (native/instlib) incl. its
      # Windows USB/HID backend (usbio_nt, hidio); ChromIQWin.spec bundles the
      # binary when present and the engine falls back to stock chartread if not.
      - name: Build chart-reading engine (x64, mingw-w64)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            export PATH="/c/Program Files/CMake/bin:$PATH"; }
          cmake -S native/chartread_helper -B build/chartread -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build/chartread
          cp build/chartread/chromiq-chartread.exe native/chromiq-chartread.exe
          echo "engine deps:"; objdump -p native/chromiq-chartread.exe | grep -i "DLL Name" || true

      # arm64 counterpart: mingw-w64 has no arm64 host toolchain, so use
      # LLVM-mingw (clang -> aarch64-w64-mingw32). CMake treats it as MINGW, so
      # the same static-linking path applies unchanged (self-contained .exe,
      # deps = only api-ms-win-crt-* / KERNEL32 — verified natively on an arm64
      # box). Proven with LLVM-mingw 20250430; bump the tag if the URL 404s.
      - name: Build bit-exact gamut helper (arm64, LLVM-mingw)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvmVer = '20250430'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$llvmVer/llvm-mingw-$llvmVer-ucrt-aarch64.zip"
          Invoke-WebRequest $url -OutFile llvm.zip
          Expand-Archive llvm.zip -DestinationPath tools -Force
          $llvmDir = "$PWD\tools\llvm-mingw-$llvmVer-ucrt-aarch64"
          $env:PATH = "$llvmDir\bin;$env:PATH"
          choco install ninja -y --no-progress
          # windows-11-arm is a leaner image than windows-latest — install CMake
          # if it isn't already on PATH (x64 CMake runs fine under emulation; it
          # only orchestrates, the compiler is the native aarch64 clang above).
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            $env:PATH = "C:\Program Files\CMake\bin;$env:PATH"
          }
          cmake -S native/gammap_helper -B build/gammap -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang
          cmake --build build/gammap
          Copy-Item build/gammap/chromiq-gammap.exe native/chromiq-gammap.exe -Force
          Write-Host "helper deps:"
          & "$llvmDir\bin\llvm-readobj.exe" --coff-imports native/chromiq-gammap.exe |
            Select-String 'Name:' | Sort-Object -Unique

      - name: Build chart-reading engine (arm64, LLVM-mingw)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvmVer = '20250430'
          $llvmDir = "$PWD\tools\llvm-mingw-$llvmVer-ucrt-aarch64"
          if (-not (Test-Path $llvmDir)) {
            $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$llvmVer/llvm-mingw-$llvmVer-ucrt-aarch64.zip"
            Invoke-WebRequest $url -OutFile llvm.zip
            Expand-Archive llvm.zip -DestinationPath tools -Force
          }
          $env:PATH = "$llvmDir\bin;$env:PATH"
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $env:PATH = "C:\Program Files\CMake\bin;$env:PATH"
          }
          cmake -S native/chartread_helper -B build/chartread -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang
          cmake --build build/chartread
          Copy-Item build/chartread/chromiq-chartread.exe native/chromiq-chartread.exe -Force
          Write-Host "engine deps:"
          & "$llvmDir\bin\llvm-readobj.exe" --coff-imports native/chromiq-chartread.exe |
            Select-String 'Name:' | Sort-Object -Unique

      - name: Build Windows executable
        run: python -m PyInstaller ChromIQWin.spec

      - name: Package as ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist\ChromIQ -DestinationPath '${{ matrix.artifact }}'
          $size = (Get-Item '${{ matrix.artifact }}').Length / 1MB
          Write-Host ("ZIP size: {0:N1} MB" -f $size)

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          # Mark pre-release-style tags (-alpha/-beta/-rc/-pre) as
          # GitHub prereleases; final tags (e.g. v3.5.0) stay regular.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            body=$(awk "/^## ${TAG}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
            if [ -z "$body" ]; then
              # No CHANGELOG.md entry for this tag — fall back to commit subjects
              # since the previous tag so release notes are never empty.
              PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
              if [ -n "$PREV_TAG" ]; then
                COMMITS=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}")
                body=$(printf '### Changes since %s\n%s' "$PREV_TAG" "$COMMITS")
              else
                COMMITS=$(git log --pretty=format:'- %s' "$TAG")
                body=$(printf '### Changes\n%s' "$COMMITS")
              fi
            fi
            {
              printf '%s\n\n---\n' "$body"
              printf '**Installation (Windows):** Download the ZIP for your architecture '
              printf '(x64 for most PCs, x86 for 32-bit systems, arm64 for ARM laptops). '
              printf 'Extract it, open the ChromIQ folder, and run ChromIQ.exe. '
              printf 'Windows SmartScreen may warn on first launch — '
              printf 'click "More info" → "Run anyway". '
              printf 'Requires ArgyllCMS 3.5.0 installed and configured in Preferences.'
              printf '\n\n---\n☕ ChromIQ is free and always will be — if it saves you time or ink, a coffee is a kind way to say thanks. Completely optional, and the app stays fully featured either way.\n\n'
              printf '[![Support ChromIQ on Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/itsab1989)\n'
            } > /tmp/release_notes.txt
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes-file /tmp/release_notes.txt \
              $PRERELEASE_FLAG 2>/dev/null || true
          fi

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Version-stamp the asset filename (ChromIQ-Windows-x64_v3.9.29.zip)
          # so downloads don't collide as "...(1).zip" and each file is
          # self-identifying. The download-stats dashboard classifies by the
          # platform/arch tokens, which the suffix leaves intact.
          ART="${{ matrix.artifact }}"
          VERSIONED="${ART%.zip}_${RELEASE_TAG}.zip"
          mv "$ART" "$VERSIONED"
          gh release upload "$RELEASE_TAG" "$VERSIONED" --clobber

name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v3.0.0-beta.1)'
        required: true
      # A CI check, not a release: build the dispatched branch's own commit
      # and publish nothing (no release created, no asset uploaded). `tag`
      # then only names the files. Off by default, and absent on a tag push,
      # so a real release build behaves exactly as before.
      dry_run:
        description: 'Dry run: build the dispatched branch, create no release, upload nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: ChromIQ-Windows-x64.zip
            runner: windows-latest
            python_arch: x64
            # waf's --target-arch, and the folder PyInstaller looks in.
            pyi_target_arch: 64bit
            pyi_platform: Windows-64bit-intel

          - arch: arm64
            artifact: ChromIQ-Windows-arm64.zip
            runner: windows-11-arm
            python_arch: arm64
            pyi_target_arch: 64bit-arm
            pyi_platform: Windows-64bit-arm

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # EVERY BINARY INPUT THIS BUILD DOWNLOADS IS PINNED BY SHA-256, AND THE
      # BUILD STOPS ON A MISMATCH (2026-11-09, after Defender flagged 4.3.28).
      # The hashes are of the files the last green release build (4.3.28)
      # downloaded: the assets have not been replaced since (GitHub's
      # updated_at predates that build), zadig-2.9.exe hashes the same as the
      # zadig.exe inside the 4.3.28 zip, and the two Authenticode-signed ones
      # (the WDK redistributable, Microsoft; zadig, Akeo) carry signatures
      # whose digests match their contents. None of the publishers posts a
      # checksum file. A moved download fails here instead of shipping
      # something nobody looked at: re-download it, check it, re-pin it.
      LIBWDI_COMMIT: 30df0c0e051b0132c4b9ebed8c054bc8eb3aaaec  # master since 2025-07-17, used by 4.3.27 and 4.3.28
      WDK_REDIST_SHA256: 29314207814ce9d5d73695f7e9239539cf37c79e750b9d5ea5a5ef5487a583d6     # wdfcoinstaller.msi via fwlink 253170
      LIBUSB0_SHA256: 9950b7a226e3ea387365c046d13b68bd0b0b18c015c034363601ff601c5b5585        # libusb-win32-bin-1.4.0.0.zip
      LIBUSBK_SHA256: 38605d8d5a86f408a4b7bec60f6d4a096050eee72f89a63a8d5be125252d3fe7        # libusbK-3.1.0.0-bin.7z
      ZADIG_SHA256: 4ecaa95df3da3621486a043aef8b3050b8bafe7c901402871e816229ef82039b          # zadig-2.9.exe (libwdi v1.5.1)
      LLVM_MINGW_SHA256: 46be741db12b2ba4b0f0f8f22bef2bd86780de4b139092f3413664b5a8b42337     # llvm-mingw-20250430-ucrt-aarch64.zip
      # PyInstaller's source distribution, for building its bootloader. Must be
      # the version requirements-build.txt pins; the step below refuses a
      # mismatch, so moving the pin means moving these two lines with it.
      # sha256 as published by PyPI for pyinstaller-6.22.3.tar.gz.
      PYI_SDIST_VERSION: '6.22.3'
      PYI_SDIST_URL: https://files.pythonhosted.org/packages/63/41/f90302845945abd4ed647933ff5ee7c6ac93983187be67f897b6cb613331/pyinstaller-6.22.3.tar.gz
      PYI_SDIST_SHA256: 05eb2f5615503e72939a7224d68b4aff572c6b0438ee4a17d0a4b481f399362d

    steps:
      # The runner's git converts LF to CRLF on checkout (core.autocrlf=true
      # on Windows images), so every text asset in the Windows bundle (the
      # .cht charts, Knut's preset files, the i18n catalogues) shipped with
      # different bytes from the macOS and Linux bundles. Check out exactly
      # what is in the repository (CI finding RB-4, 2026-10-04).
      - name: Check out without line-ending conversion
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.ref_name }}
          fetch-depth: 0  # need full history + tags for the release-notes fallback

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}

      # pycups is macOS/Linux-only; filter it out before installing.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v 'pycups' requirements.txt > requirements-win.txt
          pip install -r requirements-win.txt -r requirements-build.txt

      # OUR OWN BOOTLOADER, NOT THE ONE EVERY PYINSTALLER APP SHIPS
      # (2026-11-09). ChromIQ.exe is PyInstaller's runw.exe with our archive
      # appended. The wheel's runw.exe is byte-for-byte the one in every
      # PyInstaller app in the world, malware included, so Defender's
      # machine-learning verdicts (4.3.28: Wacatac...!ml) learn it as a
      # feature of bad files. PyInstaller's own documentation gives "anti-virus
      # false positives that result from the wide-spread use of pre-compiled
      # bootloaders" as the reason to build it yourself:
      # https://pyinstaller.org/en/stable/bootloader-building.html
      #
      # Built from the PyPI source distribution of the SAME version as the
      # pinned wheel (verified by sha256), with the runner's MSVC, which waf
      # finds by itself (no vcvarsall). The sdist carries prebuilt Windows
      # bootloaders; they are deleted first, so whatever lands in the folder
      # was compiled here. The four built exes then replace the wheel's in the
      # installed PyInstaller (the same files `waf all` installs into a source
      # tree), and the step after the build proves ChromIQ.exe carries them.
      - name: Build PyInstaller's bootloader from source
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^pyinstaller==\([0-9][0-9.]*\).*/\1/p' requirements-build.txt)
          if [ "$pinned" != "$PYI_SDIST_VERSION" ]; then
            echo "::error::requirements-build.txt pins PyInstaller $pinned, the bootloader source is $PYI_SDIST_VERSION; move PYI_SDIST_* with the pin"
            exit 1
          fi
          # POSIX form: GNU tar reads "D:\..." as a remote host "D".
          src="$(cygpath -u "$RUNNER_TEMP")/pyi-bootloader-src"
          rm -rf "$src"; mkdir -p "$src"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$src/sdist.tar.gz" "$PYI_SDIST_URL"
          echo "$PYI_SDIST_SHA256  $src/sdist.tar.gz" | sha256sum -c -
          tar -xzf "$src/sdist.tar.gz" -C "$src"
          tree="$src/pyinstaller-$PYI_SDIST_VERSION"
          rm -rf "$tree"/PyInstaller/bootloader/Windows-*
          ( cd "$tree/bootloader" && python ./waf all --target-arch=${{ matrix.pyi_target_arch }} )
          built="$tree/PyInstaller/bootloader/${{ matrix.pyi_platform }}"
          ls -l "$built"

          installed=$(python -c "import os, PyInstaller; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', '${{ matrix.pyi_platform }}'))")
          echo "PyInstaller $(python -c 'import PyInstaller; print(PyInstaller.__version__)') at $installed"
          cp "$installed/runw.exe" "$RUNNER_TEMP/wheel-runw.exe"
          for exe in run.exe run_d.exe runw.exe runw_d.exe; do
            test -f "$built/$exe" || { echo "::error::waf did not build $exe"; exit 1; }
            # From stdin: sha256sum prefixes a "\" to the hash of a path
            # with backslashes in it, and the two would never compare equal.
            wheel=$(sha256sum < "$installed/$exe" | cut -d' ' -f1)
            ours=$(sha256sum < "$built/$exe" | cut -d' ' -f1)
            echo "$exe  wheel=$wheel  built=$ours"
            if [ "$wheel" = "$ours" ]; then
              echo "::error::the built $exe is identical to the wheel's; building it gained nothing"
              exit 1
            fi
            cp "$built/$exe" "$installed/$exe"
          done
          cp "$built/runw.exe" "$RUNNER_TEMP/built-runw.exe"

      # Generate a .ico from the existing app_icon.png using Pillow (already installed).
      - name: Generate Windows icon
        shell: python
        run: |
          from PIL import Image
          img = Image.open('assets/app_icon.png').convert('RGBA')
          img.save(
              'assets/app_icon.ico',
              format='ICO',
              sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          print('Generated assets/app_icon.ico')

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # libwdi at one fixed commit, fetched by its SHA (git checks every object
      # against its id, so the tree is the one that commit names), and the
      # three driver packages wdi-simple embeds, each checked against its
      # pinned sha256 before anything unpacks it. Was `git clone --depth=1` of
      # master and three unchecked downloads.
      - name: Fetch libwdi and its driver packages (pinned, verified)
        shell: bash
        run: |
          set -euo pipefail
          git init -q libwdi-src
          git -C libwdi-src fetch -q --depth=1 https://github.com/pbatard/libwdi.git "$LIBWDI_COMMIT"
          git -C libwdi-src -c advice.detachedHead=false checkout -q FETCH_HEAD
          head=$(git -C libwdi-src rev-parse HEAD)
          echo "libwdi at $head"
          [ "$head" = "$LIBWDI_COMMIT" ] || { echo "::error::libwdi is at $head, not $LIBWDI_COMMIT"; exit 1; }

          fetch() {  # url, file, sha256
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch "https://go.microsoft.com/fwlink/p/?LinkID=253170" wdk-redist.msi "$WDK_REDIST_SHA256"
          fetch "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip" libusb0.zip "$LIBUSB0_SHA256"
          fetch "https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z" libusbk.7z "$LIBUSBK_SHA256"

          # wdi-simple's VERSIONINFO. libwdi ships examples/wdi-simple.rc
          # (Pete Batard's own name, version and licence for the program), but
          # its MSVC project never compiles it, so wdi_simple.exe went out as
          # the one exe in the bundle with no VERSIONINFO at all. Compile
          # upstream's .rc as it stands: the wrapper only supplies what MSVC's
          # rc needs and MinGW gets from afxres.h (VS_VERSION_INFO), and reads
          # the file as the Windows-1252 it is: its copyright sign is the
          # single byte 0xA9, which read as UTF-8 became a replacement character.
          printf '#include <winver.h>\r\n#pragma code_page(1252)\r\n#include "wdi-simple.rc"\r\n' \
            > libwdi-src/examples/wdi-simple-version.rc
          proj=libwdi-src/examples/.msvc/wdi-simple.vcxproj
          # Anchored: ProjectReference items carry <Project>{guid}</Project> too.
          grep -q '^</Project>' "$proj"
          sed -i 's#^</Project>#  <ItemGroup>\r\n    <ResourceCompile Include="..\\wdi-simple-version.rc" />\r\n  </ItemGroup>\r\n</Project>#' "$proj"
          grep -n 'ResourceCompile' "$proj"
          [ "$(grep -c 'ResourceCompile' "$proj")" = 1 ]

      # Build wdi-simple from libwdi source. Only x64 is needed — x64 binaries run on
      # ARM64 Windows via the built-in x64 emulation layer.
      - name: Build wdi-simple from source
        shell: cmd
        run: |
          REM libwdi pins PlatformToolset=v143 (VS2022). The windows-latest image
          REM moved to VS18 and dropped the v143 ARM64 component, so the solution's
          REM installer_arm64.vcxproj fails with MSB8020. Retarget every project to
          REM the runner's default toolset instead: v143 on windows-11-arm (VS2022,
          REM unchanged), the current one on whatever VS the x64 image ships.
          powershell -Command "Get-ChildItem -Recurse libwdi-src -Filter *.vcxproj | ForEach-Object { (Get-Content $_.FullName) -replace '<PlatformToolset>v\d+</PlatformToolset>', '<PlatformToolset>$(DefaultPlatformToolset)</PlatformToolset>' | Set-Content $_.FullName }"

          REM All prerequisites go inside libwdi-src\ — embedder resolves paths from libwdi-src\libwdi\
          REM (downloaded and sha256-checked by the step before)
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\libwdi-src\wdk

          7z x libusb0.zip -o"libwdi-src"

          7z x libusbk.7z -o"libwdi-src"

          cd libwdi-src
          ren libusb-win32-bin-1.4.0.0 libusb0
          ren libusbK-3.1.0.0-bin libusbk
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=x64,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\";LIBUSB0_DIR=\"../libusb0\";LIBUSBK_DIR=\"../libusbk/bin\""

          copy x64\Release\examples\wdi-simple.exe ..\assets\wdi_simple.exe
          dir ..\assets\wdi_simple.exe

      # zadig.exe is bundled as the fallback if wdi-simple fails or is cancelled.
      - name: Download Zadig (fallback USB driver installer)
        shell: bash
        run: |
          # --retry-all-errors so a transient HTTP 503 from the download CDN is
          # retried instead of failing the whole build (it flaked a beta once).
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/zadig.exe \
            "https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe"
          echo "$ZADIG_SHA256  assets/zadig.exe" | sha256sum -c -

      # Bit-exact gamut-mapping helper — ArgyllCMS's real gamut mapper compiled
      # from the vendored subset (native/argyll) with mingw-w64 gcc, statically
      # linked so the .exe needs no runtime DLLs (verified via objdump on a local
      # cross-build). x64 only: on Windows-arm64 the app falls back to the fast
      # Python mapper, and ChromIQWin.spec bundles the helper only when present.
      - name: Build bit-exact gamut helper (x64, mingw-w64)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          choco install mingw ninja -y --no-progress
          # CMake is preinstalled on windows-latest, but install it if a future
          # image drops it so the build fails loudly on choco, not on a bare cmake.
          command -v cmake >/dev/null 2>&1 || {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            export PATH="/c/Program Files/CMake/bin:$PATH"; }
          gcc --version
          cmake -S native/gammap_helper -B build/gammap -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build/gammap
          cp build/gammap/chromiq-gammap.exe native/chromiq-gammap.exe
          echo "helper deps:"; objdump -p native/chromiq-gammap.exe | grep -i "DLL Name" || true

      # Chart-reading engine (x64) — chromiq-chartread, same mingw-w64 toolchain.
      # Links the vendored Argyll instrument library (native/instlib) incl. its
      # Windows USB/HID backend (usbio_nt, hidio); ChromIQWin.spec bundles the
      # binary when present and the engine falls back to stock chartread if not.
      - name: Build chart-reading engine (x64, mingw-w64)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null 2>&1 || {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            export PATH="/c/Program Files/CMake/bin:$PATH"; }
          cmake -S native/chartread_helper -B build/chartread -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build/chartread
          cp build/chartread/chromiq-chartread.exe native/chromiq-chartread.exe
          echo "engine deps:"; objdump -p native/chromiq-chartread.exe | grep -i "DLL Name" || true

      # arm64 counterpart: mingw-w64 has no arm64 host toolchain, so use
      # LLVM-mingw (clang -> aarch64-w64-mingw32). CMake treats it as MINGW, so
      # the same static-linking path applies unchanged (self-contained .exe,
      # deps = only api-ms-win-crt-* / KERNEL32 — verified natively on an arm64
      # box). Proven with LLVM-mingw 20250430; bump the tag if the URL 404s.
      - name: Build bit-exact gamut helper (arm64, LLVM-mingw)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvmVer = '20250430'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$llvmVer/llvm-mingw-$llvmVer-ucrt-aarch64.zip"
          Invoke-WebRequest $url -OutFile llvm.zip
          $got = (Get-FileHash llvm.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw sha256 $got, pinned $env:LLVM_MINGW_SHA256" }
          Expand-Archive llvm.zip -DestinationPath tools -Force
          $llvmDir = "$PWD\tools\llvm-mingw-$llvmVer-ucrt-aarch64"
          $env:PATH = "$llvmDir\bin;$env:PATH"
          choco install ninja -y --no-progress
          # windows-11-arm is a leaner image than windows-latest — install CMake
          # if it isn't already on PATH (x64 CMake runs fine under emulation; it
          # only orchestrates, the compiler is the native aarch64 clang above).
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            $env:PATH = "C:\Program Files\CMake\bin;$env:PATH"
          }
          cmake -S native/gammap_helper -B build/gammap -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang
          cmake --build build/gammap
          Copy-Item build/gammap/chromiq-gammap.exe native/chromiq-gammap.exe -Force
          Write-Host "helper deps:"
          & "$llvmDir\bin\llvm-readobj.exe" --coff-imports native/chromiq-gammap.exe |
            Select-String 'Name:' | Sort-Object -Unique

      - name: Build chart-reading engine (arm64, LLVM-mingw)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvmVer = '20250430'
          $llvmDir = "$PWD\tools\llvm-mingw-$llvmVer-ucrt-aarch64"
          if (-not (Test-Path $llvmDir)) {
            $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$llvmVer/llvm-mingw-$llvmVer-ucrt-aarch64.zip"
            Invoke-WebRequest $url -OutFile llvm.zip
            $got = (Get-FileHash llvm.zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw sha256 $got, pinned $env:LLVM_MINGW_SHA256" }
            Expand-Archive llvm.zip -DestinationPath tools -Force
          }
          $env:PATH = "$llvmDir\bin;$env:PATH"
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            $env:PATH = "C:\Program Files\CMake\bin;$env:PATH"
          }
          cmake -S native/chartread_helper -B build/chartread -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang
          cmake --build build/chartread
          Copy-Item build/chartread/chromiq-chartread.exe native/chromiq-chartread.exe -Force
          Write-Host "engine deps:"
          & "$llvmDir\bin\llvm-readobj.exe" --coff-imports native/chromiq-chartread.exe |
            Select-String 'Name:' | Sort-Object -Unique

      - name: Build Windows executable
        run: python -m PyInstaller ChromIQWin.spec

      # ChromIQ.exe is runw.exe with our icon, VERSIONINFO and archive added;
      # its code section is the bootloader's, untouched. So the code section
      # must be the one built above and not the wheel's, or the build fails.
      - name: Check ChromIQ.exe carries the bootloader built here
        shell: python
        env:
          PYTHONIOENCODING: utf-8  # the copyright signs in the VERSIONINFO printed below
        run: |
          import hashlib, os, sys
          import pefile
          tmp = os.environ["RUNNER_TEMP"]
          def sections(path):
              pe = pefile.PE(path, fast_load=True)
              return {s.Name.rstrip(b"\0").decode(): hashlib.sha256(s.get_data()).hexdigest()
                      for s in pe.sections}
          app = sections(r"dist\ChromIQ\ChromIQ.exe")
          ours = sections(os.path.join(tmp, "built-runw.exe"))
          wheel = sections(os.path.join(tmp, "wheel-runw.exe"))
          print(f".text  ChromIQ.exe={app['.text']}")
          print(f".text  built runw={ours['.text']}")
          print(f".text  wheel runw={wheel['.text']}")
          if app[".text"] != ours[".text"]:
              sys.exit("ChromIQ.exe's code is not the bootloader built in this job")
          if app[".text"] == wheel[".text"]:
              sys.exit("ChromIQ.exe's code is the wheel's prebuilt bootloader")
          print("ChromIQ.exe carries the bootloader built in this job")

          # Every exe of ours in the bundle names itself (VERSIONINFO).
          def version_info(path):
              pe = pefile.PE(path)
              for fi in getattr(pe, "FileInfo", None) or []:
                  for entry in fi:
                      for table in getattr(entry, "StringTable", []):
                          return {k.decode(): v.decode() for k, v in table.entries.items()}
              return {}
          missing, garbled = [], []
          for rel in (r"ChromIQ.exe", r"_internal\native\chromiq-gammap.exe",
                      r"_internal\native\chromiq-chartread.exe",
                      r"_internal\assets\wdi_simple.exe", r"_internal\assets\zadig.exe"):
              info = version_info(os.path.join(r"dist\ChromIQ", rel))
              print(f"{rel}: {info}")
              if not info.get("CompanyName") or not info.get("ProductName"):
                  missing.append(rel)
              if any("\ufffd" in v for v in info.values()):
                  garbled.append(rel)
          if missing:
              sys.exit(f"no VERSIONINFO in {missing}")
          if garbled:
              sys.exit(f"VERSIONINFO with a broken character in {garbled}")

      # START THE BUILT APP BEFORE IT IS ZIPPED, ON BOTH ARCHITECTURES. The
      # same check the macOS build runs (core/selftest.py, CHROMIQ_SELFTEST=1):
      # the frozen app loads numpy and Qt's widgets, does one inversion, prints
      # one line and exits, with no window and no setting touched. ChromIQ.exe
      # is a windowed build, so an import error would sit in a message box for
      # ever; the timeout turns that into a failure.
      - name: Start the built app's self-test
        shell: bash
        run: |
          set -uo pipefail
          # Actions starts bash with -e: without || a failing app would stop
          # the step here, before its output and the error line are printed.
          rc=0
          out=$(CHROMIQ_SELFTEST=1 timeout 300 ./dist/ChromIQ/ChromIQ.exe 2>&1) || rc=$?
          echo "exit=$rc"
          echo "$out"
          [ "$rc" -eq 0 ] || { echo "::error::the built ChromIQ.exe self-test exited $rc (124 = timed out)"; exit 1; }
          echo "$out" | grep -q "^chromiq-selftest ok machine=" || {
            echo "::error::the built ChromIQ.exe exited 0 without its self-test line"; exit 1; }

      - name: Package as ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist\ChromIQ -DestinationPath '${{ matrix.artifact }}'
          $size = (Get-Item '${{ matrix.artifact }}').Length / 1MB
          Write-Host ("ZIP size: {0:N1} MB" -f $size)

      - name: Dry run, nothing published
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          ls -lh "${{ matrix.artifact }}"
          # Every file in the bundle with its sha256, so a dry run can be
          # compared with a released zip from the log alone, nothing uploaded.
          echo "BUNDLE MANIFEST BEGIN"
          python -c "
          import hashlib, os
          rows = []
          for d, _, fs in os.walk(os.path.join('dist', 'ChromIQ')):
              for n in fs:
                  p = os.path.join(d, n)
                  rel = os.path.relpath(p, 'dist').replace(os.sep, '/')
                  rows.append((rel, hashlib.sha256(open(p, 'rb').read()).hexdigest()))
          for rel, h in sorted(rows):
              print(f'{h}  ./{rel}')
          "
          echo "BUNDLE MANIFEST END"

      - name: Create GitHub Release (if not exists)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          # Mark pre-release-style tags (-alpha/-beta/-rc/-pre) as
          # GitHub prereleases; final tags (e.g. v3.5.0) stay regular.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            body=$(awk "/^## ${TAG}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
            if [ -z "$body" ]; then
              # No CHANGELOG.md entry for this tag — fall back to commit subjects
              # since the previous tag so release notes are never empty.
              PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
              if [ -n "$PREV_TAG" ]; then
                COMMITS=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}")
                body=$(printf '### Changes since %s\n%s' "$PREV_TAG" "$COMMITS")
              else
                COMMITS=$(git log --pretty=format:'- %s' "$TAG")
                body=$(printf '### Changes\n%s' "$COMMITS")
              fi
            fi
            {
              printf '%s\n\n---\n' "$body"
              printf '**Installation (Windows):** Download the ZIP for your architecture '
              printf '(x64 for most PCs, x86 for 32-bit systems, arm64 for ARM laptops). '
              printf 'Extract it, open the ChromIQ folder, and run ChromIQ.exe. '
              printf 'Windows SmartScreen may warn on first launch — '
              printf 'click "More info" → "Run anyway". '
              printf 'Requires ArgyllCMS 3.5.0 installed and configured in Preferences.'
              printf '\n\n---\n☕ ChromIQ is free and always will be — if it saves you time or ink, a coffee is a kind way to say thanks. Completely optional, and the app stays fully featured either way.\n\n'
              printf '[![Support ChromIQ on Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/itsab1989)\n'
            } > /tmp/release_notes.txt
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes-file /tmp/release_notes.txt \
              $PRERELEASE_FLAG 2>/dev/null || true
          fi

      - name: Upload ZIP to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Version-stamp the asset filename (ChromIQ-Windows-x64_v3.9.29.zip)
          # so downloads don't collide as "...(1).zip" and each file is
          # self-identifying. The download-stats dashboard classifies by the
          # platform/arch tokens, which the suffix leaves intact.
          ART="${{ matrix.artifact }}"
          VERSIONED="${ART%.zip}_${RELEASE_TAG}.zip"
          mv "$ART" "$VERSIONED"
          gh release upload "$RELEASE_TAG" "$VERSIONED" --clobber

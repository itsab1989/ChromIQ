name: Feature request
description: 'Suggest a new feature or improvement. Support for a new measuring instrument? Please read docs/adding_an_instrument.md first and title the issue "New instrument: <make and model>".'
title: "[Feature] <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain point or missing capability — not the proposed solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like ChromIQ to behave? Mockups, screenshots, or references to other tools are very welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about and why they fall short.

  - type: dropdown
    id: platform
    attributes:
      label: Relevant platform(s)
      multiple: true
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (ARM64)
        - Linux
        - Any / all
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots, related links, sample data, etc.
